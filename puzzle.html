<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>DragON POKER - Puzzle</title>
<link rel="stylesheet" href="style.css">
<style>
  .puzzle-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    position: relative;
    z-index: 1;
    font-family: 'IBM Plex Mono', monospace;
  }
  .puzzle-title-text {
    color: var(--gold);
    font-weight: 700;
    font-size: 0.85rem;
  }
  .hint-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
    font-size: 1rem;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    font-weight: 700;
  }
  .hint-btn:hover { background: rgba(201,168,76,0.15); }
  .hint-btn:active { transform: scale(0.95); }
  .puzzle-condition-bar {
    max-height: 2.8em;
    overflow: hidden;
    font-size: 0.7rem;
    line-height: 1.4;
    color: rgba(255,255,255,0.45);
    text-align: center;
    padding: 2px 12px;
  }
  /* Override removed card background */
  .removed-card {
    background: #2c2c2c;
    border-color: rgba(255,255,255,0.12);
  }
</style>
</head>
<body class="game-page">
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

<div class="back-fixed"><a href="puzzle_select.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div class="header">
  <div id="global-header"></div>
  <div style="position:absolute;right:16px;display:flex;align-items:center;gap:6px;">
    <button class="qr-btn">?</button>
    <button class="hint-btn" id="hintBtn" title="힌트">?</button>
  </div>
</div>

<div class="puzzle-header">
  <span class="puzzle-title-text" id="puzzleTitle">Puzzle 1</span>
</div>

<div class="grid-container" id="gridContainer">
  <div class="grid" id="grid"></div>
  <svg class="drag-svg" id="dragSvg"><polyline class="drag-line" id="dragLine" points="" /></svg>
  <div class="no-moves-overlay" id="noMovesOverlay">NO MORE MOVES</div>
</div>

<div class="hand-preview" id="handPreview"></div>

<div class="puzzle-condition-bar" id="puzzleConditionBar"></div>


<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div class="qr-overlay" id="qrOverlay" style="display:none">
  <div class="qr-modal" onclick="event.stopPropagation()">
    <div class="qr-scroll">
      <div id="qrHandList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="header.js"></script>
<script src="sound.js"></script>
<script src="scorepolicy.js"></script>
<script src="quickref.js"></script>
<script>
  function renderCurrencyBar() {
    _updateHeaderValues(true);
  }
</script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="server_client.js"></script>
<script>
  // [ADAPTER] 골드 DB 싱크 — Render 서버 경유 (전역 스코프)
  // server_client.js 로드 후 정의해야 syncGoldToServer 참조 가능
  async function syncGoldToDB(reason) {
    const playerId = localStorage.getItem('poker_player_id');
    if (!playerId) return;
    const gold = parseInt(localStorage.getItem('poker_gold') || '0');
    await syncGoldToServer(playerId, gold);
  }
</script>
<script>
(async () => { if (!requireRegistration()) return; await i18n.init(); initHeader(); })().then(() => {
  const s = document.createElement('script');
  s.src = 'puzzle_script.js';
  document.body.appendChild(s);
});
</script>
<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div class="start-title" id="startPuzzleTitle">Puzzle</div>
    <div class="start-subtitle" id="startPuzzleDesc"></div>
    <button class="start-btn" id="startBtn">▶ START</button>
  </div>
</div>
</body>
</html>
