<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>DragON POKER - ARCADE BATTLE</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ── 상대 정보 바 ── */
  .pvp-opponent-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.6);
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
  }
  .pvp-opp-name { color: var(--gold); font-weight: 700; }
  .pvp-opp-chip { display: flex; align-items: center; gap: 3px; }
  .pvp-opp-chip img { width: 14px; height: 14px; }
  .pvp-opp-hands {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.4);
  }

  /* ── 점수판 ── */
  .pvp-scoreboard {
    max-width: 500px;
    width: 100%;
    margin: 4px auto;
    padding: 0 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
  }
  .pvp-sb-header {
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,0.35);
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-weight: 600;
    font-size: 0.65rem;
    letter-spacing: 0.05em;
  }
  .pvp-sb-row {
    display: flex;
    align-items: center;
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    min-height: 18px;
  }
  .pvp-sb-cell {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pvp-sb-cell.left { text-align: left; color: rgba(255,255,255,0.6); }
  .pvp-sb-cell.right { text-align: right; color: rgba(255,255,255,0.6); }
  .pvp-sb-cell.vs { flex: 0; width: 20px; text-align: center; color: rgba(255,255,255,0.2); font-size: 0.6rem; }
  .pvp-sb-cell .win { color: var(--gold); }
  .pvp-sb-cell .lose { color: rgba(255,255,255,0.25); }

  /* ── 타임어택 배너 ── */
  .time-attack-banner {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(255,50,50,0.9);
    color: white;
    text-align: center;
    padding: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    z-index: 50;
    animation: bannerPulse 0.5s ease-in-out 3;
  }
  .time-attack-banner.active { display: block; }
  @keyframes bannerPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* ── 타이머 타임어택 스타일 ── */
  .timer-num.time-attack { color: #ff3333 !important; }
  .timer-ring-fg.time-attack { stroke: #ff3333 !important; }
</style>
</head>
<body class="game-page">
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

<div class="back-fixed"><a href="pvp_lobby.html" onclick="pvpCleanup()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div class="header">
  <div id="global-header"></div>
</div>

<!-- 상대 정보 -->
<div class="pvp-opponent-bar">
  <div>VS <span class="pvp-opp-name" id="oppName"></span></div>
  <div class="pvp-opp-chip"><img src="./images/chip.png" alt="chip"><span id="oppChip">0</span></div>
  <div class="pvp-opp-hands" id="oppHandCount">0/9</div>
</div>

<!-- 점수판 -->
<div class="pvp-scoreboard" id="scoreboard"></div>

<div class="status-bar">
  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 40 40">
      <circle class="timer-ring-bg" cx="20" cy="20" r="16" />
      <circle class="timer-ring-fg" id="timerRing" cx="20" cy="20" r="16"
        stroke-dasharray="100.53" stroke-dashoffset="0"
        transform="rotate(-90 20 20)" />
    </svg>
    <div class="timer-num" id="timerNum">200</div>
  </div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--gold);font-weight:700;letter-spacing:0.08em;">ARCADE BATTLE</div>
  <div style="display:flex;align-items:center;gap:6px;">
    <button class="qr-btn">?</button>
  </div>
</div>

<div class="grid-container" id="gridContainer">
  <div class="grid" id="grid"></div>
  <svg class="drag-svg" id="dragSvg"><polyline class="drag-line" id="dragLine" points="" /></svg>
  <div class="no-moves-overlay" id="noMovesOverlay">NO MORE MOVES</div>
</div>

<div class="hand-preview" id="handPreview"></div>

<div class="hand-panel">
  <div class="hand-panel-title">COLLECTED <span>[ <span id="handCount">0</span> / 9 ]</span></div>
  <div class="hand-slots" id="handSlots"></div>
</div>

<div class="removed-panel">
  <div class="removed-panel-title">REMOVED</div>
  <div class="removed-cards" id="removedCards"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div class="qr-overlay" id="qrOverlay" style="display:none">
  <div class="qr-modal" onclick="event.stopPropagation()">
    <div class="qr-scroll">
      <div id="qrHandList"></div>
    </div>
  </div>
</div>

<div class="time-attack-banner" id="timeAttackBanner"></div>

<!-- script.js 호환용 더미 엘리먼트 -->
<div style="display:none">
  <button id="restartBtn"></button>
  <div id="currentScore"></div>
  <div id="highScoreDisplay"></div>
  <div id="retryLabel"></div>
  <div id="leaderboardOverlay"><div id="leaderboardModal"></div></div>
  <button id="btnSaveReplay"></button>
  <div id="allUserTopScoreRow"></div>
  <div id="usernameDisplay"></div>
</div>

<div class="toast" id="toast"></div>

<script src="server_client.js"></script>
<script src="pvp_utils.js"></script>
<script>

    location.href = 'pvp_lobby.html';

})().then(() => {

  s.src = 'script.js';

<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div class="start-title" id="pvpStartTitle">ARCADE BATTLE</div>

    <button class="start-btn" id="startBtn">▶ START</button>
  </div>
</div>
</body>
</html>
