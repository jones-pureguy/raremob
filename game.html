<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>DragON POKER</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

<div class="back-fixed"><a href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div class="header">
  <div id="global-header"></div>
</div>

<div class="status-bar">
  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 40 40">
      <circle class="timer-ring-bg" cx="20" cy="20" r="16" />
      <circle class="timer-ring-fg" id="timerRing" cx="20" cy="20" r="16"
        stroke-dasharray="100.53" stroke-dashoffset="0"
        transform="rotate(-90 20 20)" />
    </svg>
    <div class="timer-num" id="timerNum">200</div>
  </div>
  <div class="score-display">
    <div class="current-score" id="currentScore">0</div>
    <span id="retryLabel" style="display:none;color:#FFD740;font-size:0.7rem;font-weight:700;letter-spacing:0.5px;margin-left:4px;">(RETRY)</span>
    <div class="high-score">HI <span id="highScoreDisplay">0</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <button class="qr-btn">?</button>
    <button class="restart-btn" id="restartBtn" title="재시작">↺</button>
  </div>
</div>

<div class="grid-container" id="gridContainer">
  <div class="grid" id="grid"></div>
  <svg class="drag-svg" id="dragSvg"><polyline class="drag-line" id="dragLine" points="" /></svg>
  <div class="no-moves-overlay" id="noMovesOverlay">NO MORE MOVES</div>
</div>

<div class="hand-preview" id="handPreview"></div>

<div class="hand-panel">
  <div class="hand-panel-title">COLLECTED <span>[ <span id="handCount">0</span> / 9 ]</span></div>
  <div class="hand-slots" id="handSlots"></div>
</div>

<div class="removed-panel">
  <div class="removed-panel-title">REMOVED</div>
  <div class="removed-cards" id="removedCards"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div class="modal-overlay" id="leaderboardOverlay">
  <div class="modal leaderboard-modal" id="leaderboardModal"></div>
</div>

<div class="qr-overlay" id="qrOverlay" style="display:none">
  <div class="qr-modal" onclick="event.stopPropagation()">
    <div class="qr-scroll">
      <div id="qrHandList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="header.js"></script>
<script src="sound.js"></script>
<script src="scorepolicy.js"></script>
<script src="quickref.js"></script>
<script>
  function renderCurrencyBar() {
    _updateHeaderValues(true);
    updateRestartButtonState();
  }

  // ─── Gold helpers ───
  function deductGoldLocal(amount, reason) {
    const current = parseInt(localStorage.getItem('poker_gold') || '0');
    if (current < amount) {
      showToast('골드가 부족합니다.');
      return false;
    }
    localStorage.setItem('poker_gold', current - amount);
    renderCurrencyBar();
    return true;
  }

  function updateRestartButtonState() {
    const gold = parseInt(localStorage.getItem('poker_gold') || '0');
    const btn = document.getElementById('restartBtn');
    if (!btn) return;
    btn.style.opacity = gold < 1 ? '0.4' : '1';
    btn.style.cursor = gold < 1 ? 'not-allowed' : 'pointer';
  }
</script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="server_client.js"></script>
<script>
  // [ADAPTER] 골드 DB 싱크 — Render 서버 경유 (전역 스코프)
  // server_client.js 로드 후 정의해야 syncGoldToServer 참조 가능
  async function syncGoldToDB(reason) {
    const playerId = localStorage.getItem('poker_player_id');
    if (!playerId) return;
    const gold = parseInt(localStorage.getItem('poker_gold') || '0');
    await syncGoldToServer(playerId, gold);
  }
</script>
<script>
(async () => {
  await i18n.init();
  initHeader();
  await ScorePolicy.load();
})().then(() => {
  const s = document.createElement('script');
  s.src = 'script.js';
  document.body.appendChild(s);
});
</script>
<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div class="start-title">DragON POKER</div>
    <div class="start-subtitle">BASIC GAME</div>
    <button class="start-btn" id="startBtn">▶ START</button>
  </div>
</div>
</body>
</html>
