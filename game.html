<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>DragON POKER</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

<div class="header">
  <div class="title">DRAG.on.POKER</div>
  <div style="display:flex;align-items:center;gap:8px;">
  <div class="username-display" id="usernameDisplay"></div>
  <button class="restart-btn" id="restartBtn" title="재시작">↺</button>
  </div>
</div>

<div class="status-bar">
  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 40 40">
      <circle class="timer-ring-bg" cx="20" cy="20" r="16" />
      <circle class="timer-ring-fg" id="timerRing" cx="20" cy="20" r="16"
        stroke-dasharray="100.53" stroke-dashoffset="0"
        transform="rotate(-90 20 20)" />
    </svg>
    <div class="timer-num" id="timerNum">100</div>
  </div>
  <div class="score-display">
    <div class="current-score" id="currentScore">0</div>
    <span id="retryLabel" style="display:none;color:#FFD740;font-size:0.7rem;font-weight:700;letter-spacing:0.5px;margin-left:4px;">(RETRY)</span>
    <div class="high-score">HI <span id="highScoreDisplay">0</span></div>
  </div>
  <div class="hand-counter"><span id="handCount">0</span>/9 🃏</div>
</div>

<div class="grid-container" id="gridContainer">
  <div class="grid" id="grid"></div>
  <svg class="drag-svg" id="dragSvg"><polyline class="drag-line" id="dragLine" points="" /></svg>
  <div class="no-moves-overlay" id="noMovesOverlay">NO MORE MOVES</div>
</div>

<div class="hand-preview" id="handPreview"></div>

<div class="hand-panel">
  <div class="hand-panel-title">BEST HANDS</div>
  <div class="hand-slots" id="handSlots"></div>
</div>

<div class="removed-panel">
  <div class="removed-panel-title">REMOVED</div>
  <div class="removed-cards" id="removedCards"></div>
</div>

<div class="back-to-menu">
  <a href="index.html" class="menu-btn small">메인메뉴</a>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div class="modal-overlay" id="leaderboardOverlay">
  <div class="modal leaderboard-modal" id="leaderboardModal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="script.js"></script>
</body>
</html>
