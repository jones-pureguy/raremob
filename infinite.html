<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>DragON POKER - Infinite</title>
<link rel="stylesheet" href="style.css">
<style>
  body.infinite-mode { background: radial-gradient(ellipse at 50% 38%, #1a3560 0%, #0e1a35 55%, #040810 100%); --inf-accent: #00D4FF; --inf-border: rgba(0,212,255,0.3); min-height: 100vh; }
  body.infinite-mode .timer-ring-fg { stroke: #00D4FF; }
  body.infinite-mode .timer-num { color: #00D4FF; }
  body.infinite-mode .current-score { color: #00D4FF; text-shadow: 0 0 12px rgba(0,212,255,0.5); }
  body.infinite-mode .high-score span { color: rgba(0,212,255,0.6); }
  body.infinite-mode .inf-panel-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,212,255,0.25); padding:6px 10px; gap:12px; }
  body.infinite-mode .inf-panel-title { font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:rgba(0,212,255,0.75); letter-spacing:0.12em; }
  body.infinite-mode .inf-panel-count { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:#00D4FF; }
  body.infinite-mode .inf-hand-row { font-size:0.72rem; }
  body.infinite-mode .grid { grid-template-columns: repeat(6, 1fr); }
  .outside-cards-area { display:flex; flex-direction:column; gap:2px; padding:6px 10px; border-bottom:0.5px solid rgba(0,212,255,0.15); margin-bottom:4px; }
  .inf-oc-row { display:flex; align-items:center; gap:2px; }
  .inf-oc-suit { font-size:0.85rem; font-weight:700; width:18px; flex-shrink:0; text-align:center; line-height:1; padding:2px 0; border-radius:3px; background:rgba(255,255,255,0.75); }
  .inf-oc-suit.spade, .inf-oc-suit.club { color:#1A1A1A; }
  .inf-oc-suit.heart { color:#2E7D32; }
  .inf-oc-suit.diamond { color:#D32F2F; }
  .inf-oc-suit.club { color:#1565C0; }
  .inf-oc-cell { font-family:'IBM Plex Mono',monospace; font-size:0.6rem; font-weight:700; flex:1; min-width:0; text-align:center; padding:2px 0; border-radius:3px; color:rgba(255,255,255,0.15); border:1px solid transparent; }
  .inf-oc-cell.has-card { background:rgba(255,255,255,0.85); border-color:rgba(255,255,255,0.3); }
  .inf-oc-row[data-suit="♠"] .inf-oc-cell.has-card { color:#1A1A1A; }
  .inf-oc-row[data-suit="♥"] .inf-oc-cell.has-card { color:#2E7D32; }
  .inf-oc-row[data-suit="♦"] .inf-oc-cell.has-card { color:#D32F2F; }
  .inf-oc-row[data-suit="♣"] .inf-oc-cell.has-card { color:#1565C0; }
  body.infinite-mode .inf-hand-row.active { color:#00D4FF; }
  body.infinite-mode .inf-hand-row.active .inf-hand-count { text-shadow:0 0 8px rgba(0,212,255,0.6); }
  body.infinite-mode .inf-hand-row { border-color:rgba(0,212,255,0.08); }
  body.infinite-mode .combo-badge { border-color:#00D4FF; box-shadow:0 0 30px rgba(0,212,255,0.5); }
  body.infinite-mode .combo-count { color:#00D4FF; text-shadow:0 0 20px rgba(0,212,255,0.8); }
  body.infinite-mode .hand-preview.valid { color:#00D4FF; border-color:#00D4FF; }
  body.infinite-mode .start-box { border-color:rgba(0,212,255,0.5); box-shadow:0 4px 32px rgba(0,0,0,0.6),0 0 40px rgba(0,212,255,0.15); }
  body.infinite-mode .start-title { color:#00D4FF; text-shadow:0 0 16px rgba(0,212,255,0.5); }
  body.infinite-mode .start-btn { background:linear-gradient(160deg,#0a2a3a 0%,#061520 100%); border-color:rgba(0,212,255,0.6); color:#00D4FF; }
  body.infinite-mode .modal { border-color:rgba(0,212,255,0.4); box-shadow:0 0 40px rgba(0,212,255,0.2); }
  body.infinite-mode .drag-line { stroke:#00D4FF; }
  body.infinite-mode .card.selected { border-color:#00D4FF; box-shadow:0 0 8px rgba(0,212,255,0.5); }
  .start-combo-hint { font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:#00D4FF; text-align:center; margin-top:4px; letter-spacing:0.05em; }

  /* ── Shuffle 버튼 ── */
  .inf-shuffle-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .inf-shuffle-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(0, 212, 255, 0.1);
    border: 1.5px solid rgba(0, 212, 255, 0.4);
    color: #00D4FF;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, opacity 0.15s;
  }
  .inf-shuffle-btn:active {
    background: rgba(0, 212, 255, 0.25);
  }
  .inf-shuffle-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }
  .inf-shuffle-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    color: rgba(0, 212, 255, 0.6);
    text-align: center;
    letter-spacing: 0.05em;
  }
  .inf-shuffle-btn.no-gold {
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body class="game-page infinite-mode">
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

<div class="back-fixed"><a href="mode_select.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div class="header">
  <div id="global-header"></div>
</div>

<div class="status-bar">
  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 40 40">
      <circle class="timer-ring-bg" cx="20" cy="20" r="16" />
      <circle class="timer-ring-fg" id="timerRing" cx="20" cy="20" r="16"
        stroke-dasharray="100.53" stroke-dashoffset="0"
        transform="rotate(-90 20 20)" />
    </svg>
    <div class="timer-num" id="timerNum">600</div>
  </div>
  <div class="score-display">
    <div class="current-score" id="currentScore">0</div>
    <div class="high-score">HI <span id="highScoreDisplay">0</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <div class="inf-shuffle-wrap">
      <button class="inf-shuffle-btn" id="shuffleBtn" onclick="doShuffle()">⇄</button>
      <div class="inf-shuffle-count" id="shuffleCount">10</div>
    </div>
  </div>
</div>

<div class="grid-container" id="gridContainer">
  <div class="grid" id="grid"></div>
  <svg class="drag-svg" id="dragSvg"><polyline class="drag-line" id="dragLine" points="" /></svg>
</div>

<div class="hand-preview" id="handPreview"></div>

<!-- Combo badge -->
<div class="combo-badge" id="comboBadge"></div>

<div class="outside-cards-area" id="outsideCardsArea"></div>

<div class="inf-panel-header">
  <span class="inf-panel-title">COLLECTED</span>
  <span class="inf-panel-count" id="totalHandCount">0</span>
</div>
<div class="hand-panel inf-hand-panel" id="handPanel"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>


<div class="toast" id="toast"></div>

<script src="auth.js"></script>
<script src="i18n.js"></script>

<script src="server_client.js"></script>
<script>
  // [ADAPTER] 골드 DB 싱크 — Render 서버 경유 (전역 스코프)
  // server_client.js 로드 후 정의해야 syncGoldToServer 참조 가능
  async function syncGoldToDB(reason) {
    const playerId = localStorage.getItem('poker_player_id');
    if (!playerId) return;
    const gold = parseInt(localStorage.getItem('poker_gold') || '0');
    await syncGoldToServer(playerId, gold);
  }
</script>
<script>
(async () => {
  if (!requireRegistration()) return;
  await i18n.init();
  initHeader();
  await ScorePolicy.load();
})().then(() => {
  const s = document.createElement('script');
  s.src = 'infinite_script.js';
  document.body.appendChild(s);
});
</script>
<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div class="start-title">INFINITE MODE</div>
    <div class="start-subtitle">600초 동안 최고 점수를 노려라!</div>
    <div class="start-combo-hint">✦ 포카드 이상 패를 연속하면 콤보 점수!</div>
    <div class="start-combo-hint" style="margin-top:4px;">⇄ 셔플 <img src="./images/coin.png" alt="gold" style="width:14px;height:14px;vertical-align:-2px;">5 — 카드 전체 재배치, 최대 10회</div>
    <button class="start-btn" id="startBtn">▶ START</button>
  </div>
</div>
</body>
</html>
