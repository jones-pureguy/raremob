<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DragON POKER - Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #C9A84C;
  --gold-glow: rgba(201, 168, 76, 0.5);
  --felt-dark: #0d2818;
  --felt-mid: #14532d;
  --bg: #0a1f14;
}

body {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--bg);
  background-image: radial-gradient(ellipse at 50% 40%, var(--felt-mid) 0%, var(--felt-dark) 60%, var(--bg) 100%);
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

.header {
  width: 100%;
  max-width: 500px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 2px 8px rgba(201,168,76,0.3);
  letter-spacing: 2px;
}

.back-link {
  color: var(--gold);
  text-decoration: none;
  font-size: 0.85rem;
  border: 1px solid rgba(201,168,76,0.3);
  padding: 6px 14px;
  border-radius: 6px;
  transition: background 0.15s;
}
.back-link:hover { background: rgba(201,168,76,0.15); }

.section {
  width: 100%;
  max-width: 500px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  color: var(--gold);
  margin-bottom: 16px;
  letter-spacing: 1px;
}

.score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.score-row:last-child { border-bottom: none; }

.score-label {
  font-size: 0.85rem;
  color: #ccc;
}

.score-input {
  width: 100px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--gold);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.9rem;
  padding: 6px 10px;
  border-radius: 6px;
  text-align: right;
  outline: none;
}
.score-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 8px rgba(201,168,76,0.2);
}

.penalty-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
}

.penalty-desc {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.btn {
  flex: 1;
  padding: 12px;
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn:hover { transform: scale(1.02); }
.btn:active { transform: scale(0.98); }

.btn-save {
  background: var(--gold);
  color: #000;
}
.btn-save:hover { box-shadow: 0 0 20px var(--gold-glow); }

.btn-reset {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: #ccc;
}

.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.9);
  color: #4CAF50;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 0.85rem;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.highscore-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.highscore-row:last-child { border-bottom: none; }

.highscore-label { font-size: 0.85rem; color: #ccc; }
.highscore-value { font-size: 0.9rem; color: var(--gold); font-weight: 700; }

.btn-clear-scores {
  margin-top: 12px;
  width: 100%;
  padding: 8px;
  background: rgba(255,82,82,0.15);
  border: 1px solid rgba(255,82,82,0.3);
  color: #ff5252;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.8rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-clear-scores:hover { background: rgba(255,82,82,0.25); }
</style>
</head>
<body>

<div class="header">
  <div class="title">DragON POKER Admin</div>
  <a href="index.html" class="back-link">Game</a>
</div>

<div class="section">
  <div class="section-title">RANK SCORES</div>
  <div id="scoreList"></div>
</div>

<div class="section">
  <div class="section-title">PENALTY</div>
  <div class="penalty-row">
    <div>
      <div class="score-label">4장 초과 시 1장당 감점</div>
      <div class="penalty-desc">남은 카드가 4장보다 많을 경우 적용</div>
    </div>
    <input type="number" class="score-input" id="penaltyInput" min="0" step="10">
  </div>
</div>

<div class="section">
  <div class="btn-row">
    <button class="btn btn-reset" onclick="resetToDefaults()">Reset</button>
    <button class="btn btn-save" onclick="saveSettings()">Save</button>
  </div>
</div>

<div class="section">
  <div class="section-title">HIGH SCORES</div>
  <div id="highscoreList"></div>
  <button class="btn-clear-scores" onclick="clearHighScores()">Clear All High Scores</button>
</div>

<div class="toast" id="toast"></div>

<script>
const RANK = {
  HIGH_CARD: 0,
  ONE_PAIR: 1,
  TWO_PAIR: 2,
  THREE_KIND: 3,
  STRAIGHT: 4,
  FLUSH: 5,
  FULL_HOUSE: 6,
  FOUR_KIND: 7,
  STRAIGHT_FLUSH: 8,
  ROYAL_FLUSH: 9,
  ROYAL_FLUSH_PLUS: 10,
};

const DEFAULT_SCORES = {
  [RANK.HIGH_CARD]: 0,
  [RANK.ONE_PAIR]: 1,
  [RANK.TWO_PAIR]: 2,
  [RANK.THREE_KIND]: 5,
  [RANK.STRAIGHT]: 10,
  [RANK.FLUSH]: 15,
  [RANK.FULL_HOUSE]: 20,
  [RANK.FOUR_KIND]: 50,
  [RANK.STRAIGHT_FLUSH]: 75,
  [RANK.ROYAL_FLUSH]: 100,
  [RANK.ROYAL_FLUSH_PLUS]: 250,
};

const DEFAULT_PENALTY = 10;

const RANK_LABELS = {
  [RANK.HIGH_CARD]: 'High Card',
  [RANK.ONE_PAIR]: 'One Pair',
  [RANK.TWO_PAIR]: 'Two Pair',
  [RANK.THREE_KIND]: 'Three of a Kind',
  [RANK.STRAIGHT]: 'Straight',
  [RANK.FLUSH]: 'Flush',
  [RANK.FULL_HOUSE]: 'Full House',
  [RANK.FOUR_KIND]: 'Four of a Kind',
  [RANK.STRAIGHT_FLUSH]: 'Straight Flush',
  [RANK.ROYAL_FLUSH]: 'Royal Flush',
  [RANK.ROYAL_FLUSH_PLUS]: 'Royal Flush+',
};

const MODE_LABELS = {
  1: 'Mode 1 - Free+Jump',
  2: 'Mode 2 - Free',
  3: 'Mode 3 - Straight Line',
  4: 'Mode 4 - Horizontal/Vertical',
};

function getScoreSettings() {
  try {
    const saved = localStorage.getItem('poker_scores');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return { scores: { ...DEFAULT_SCORES }, penalty: DEFAULT_PENALTY };
}

function getHighScores() {
  try {
    const saved = localStorage.getItem('poker_highscores');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return {};
}

function renderScoreList() {
  const settings = getScoreSettings();
  const container = document.getElementById('scoreList');
  let html = '';

  const ranks = [
    RANK.HIGH_CARD, RANK.ONE_PAIR, RANK.TWO_PAIR, RANK.THREE_KIND,
    RANK.STRAIGHT, RANK.FLUSH, RANK.FULL_HOUSE,
    RANK.FOUR_KIND, RANK.STRAIGHT_FLUSH, RANK.ROYAL_FLUSH, RANK.ROYAL_FLUSH_PLUS
  ];

  ranks.forEach(r => {
    const score = settings.scores[r] !== undefined ? settings.scores[r] : DEFAULT_SCORES[r];
    html += `<div class="score-row">
      <span class="score-label">${RANK_LABELS[r]}</span>
      <input type="number" class="score-input" data-rank="${r}" value="${score}" min="0" step="10">
    </div>`;
  });

  container.innerHTML = html;
  document.getElementById('penaltyInput').value = settings.penalty !== undefined ? settings.penalty : DEFAULT_PENALTY;
}

function renderHighScores() {
  const highscores = getHighScores();
  const container = document.getElementById('highscoreList');
  let html = '';

  for (let mode = 1; mode <= 4; mode++) {
    const score = highscores['mode_' + mode] || 0;
    html += `<div class="highscore-row">
      <span class="highscore-label">${MODE_LABELS[mode]}</span>
      <span class="highscore-value">${score}</span>
    </div>`;
  }

  container.innerHTML = html;
}

function saveSettings() {
  const scores = {};
  document.querySelectorAll('[data-rank]').forEach(input => {
    const rank = parseInt(input.dataset.rank);
    scores[rank] = parseInt(input.value) || 0;
  });
  const penalty = parseInt(document.getElementById('penaltyInput').value) || 0;

  localStorage.setItem('poker_scores', JSON.stringify({ scores, penalty }));
  showToast('Settings saved!');
}

function resetToDefaults() {
  localStorage.removeItem('poker_scores');
  renderScoreList();
  showToast('Reset to defaults');
}

function clearHighScores() {
  if (confirm('Are you sure you want to clear all high scores?')) {
    localStorage.removeItem('poker_highscores');
    renderHighScores();
    showToast('High scores cleared');
  }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

renderScoreList();
renderHighScores();
</script>
</body>
</html>
