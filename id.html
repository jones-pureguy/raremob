<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DragON POKER - ID</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="back-fixed"><a href="mode_select.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div class="menu-container">
   <img src="./images/dragon.webp" alt="DragON POKER" class="menu-logo">

  <!-- 기존 닉네임이 있을 때 -->
  <div class="id-section" id="existingSection" style="display:none;">
    <div class="id-label">현재 닉네임</div>
    <div class="id-current" id="currentId"></div>
    <button class="menu-btn small" onclick="changeId()" style="margin-top:16px;">닉네임 변경</button>
  </div>

  <!-- 닉네임 설정 -->
  <div class="id-section" id="registerSection" style="display:none;">
    <div class="id-label">닉네임 설정</div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;">
      <input class="username-input" id="idInput" type="text" placeholder="NAME" maxlength="12" spellcheck="false" style="width:160px;font-size:1rem;padding:10px 14px;text-transform:none;">
      <button class="menu-btn small" onclick="registerPlayer()">저장</button>
    </div>
    <div class="id-message" id="idMessage"></div>
  </div>

  <div class="oauth-section" style="margin-top:24px;text-align:center;">
    <p style="color:rgba(255,255,255,0.35);font-size:0.75rem;margin-bottom:8px;">
      구글 계정을 연동하면 다른 기기에서도 이어할 수 있어요.
    </p>
    <button class="menu-btn small" disabled style="opacity:0.3;cursor:not-allowed;">구글 계정 연동 (준비 중)</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="server_client.js"></script>
<script src="gold_client.js"></script>
<script>
  const saved = localStorage.getItem('poker_username');

  // 미등록 유저 뒤로가기 방지
  if (!saved) {
    history.pushState(null, '', 'id.html');
    document.querySelector('.back-fixed').style.display = 'none';
  }
  window.addEventListener('popstate', () => {
    if (!localStorage.getItem('poker_username')) {
      history.pushState(null, '', 'id.html');
    }
  });

  // from=guard 토스트 표시
  if (new URLSearchParams(location.search).get('from') === 'guard') {
    setTimeout(() => {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = '닉네임을 먼저 등록해주세요';
      t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:var(--gold);padding:10px 20px;border-radius:8px;font-size:0.8rem;z-index:999;';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }, 300);
  }

  // i18n init
  i18n.init();

  function showState() {
    if (saved) {
      document.getElementById('existingSection').style.display = '';
      document.getElementById('registerSection').style.display = 'none';
      document.getElementById('currentId').textContent = saved;
    } else {
      document.getElementById('existingSection').style.display = 'none';
      document.getElementById('registerSection').style.display = '';
    }
  }

  function changeId() {
    document.getElementById('existingSection').style.display = 'none';
    document.getElementById('registerSection').style.display = '';
    document.getElementById('idInput').value = '';
    document.getElementById('idMessage').textContent = '';
  }

  async function registerPlayer() {
    const username = document.getElementById('idInput').value.trim();
    const msgEl = document.getElementById('idMessage');

    if (!username) { msgEl.textContent = i18n.t('toast.nicknameRequired'); msgEl.style.color = '#ff5252'; return; }

    msgEl.textContent = i18n.t('toast.checking');
    msgEl.style.color = 'rgba(255,255,255,0.5)';

    try {
      const uid = await initAuth();
      if (!uid) { msgEl.textContent = i18n.t('toast.authFailed'); msgEl.style.color = '#ff5252'; return; }

      // 중복 체크 (대소문자 구분 없이)
      const { data: existing, error: fetchErr } = await sbRetry(() =>
        sb.from('players').select('id').ilike('username', username).maybeSingle()
      );

      if (fetchErr) { msgEl.textContent = i18n.t('toast.networkError'); msgEl.style.color = '#ff5252'; return; }

      if (existing && existing.id !== uid) {
        msgEl.textContent = i18n.t('toast.nicknameDuplicate');
        msgEl.style.color = '#ff5252';
        return;
      }

      // [PHASE_2A_NEW bundle 8-0] players upsert → /api/player/register RPC 경유
      // 묶음 8-4 RLS 잠금 (players_update/insert 차단) 전 선행
      const INITIAL_GOLD = 200;
      const reg = await callApi('/api/player/register', { username });

      if (!reg || !reg.ok) {
        if (reg?.error === 'USERNAME_TAKEN') {
          msgEl.textContent = i18n.t('toast.nicknameDuplicate');
        } else {
          msgEl.textContent = i18n.t('toast.networkError');
        }
        msgEl.style.color = '#ff5252';
        return;
      }

      localStorage.setItem('poker_username', username);
      localStorage.setItem('poker_player_id', uid);

      // [PHASE_2A_NEW bundle 6/8-0] 신규 계정 골드 지급 — awardGold RPC
      // register_player 응답의 gold로 신규 여부 판정 (기존 existingPlayer SELECT 제거)
      if (!reg.data?.gold) {
        if (typeof window.awardGold !== 'function') {
          console.error('[initial_grant] awardGold not available — gold_client.js 로드 누락');
        } else {
          const ok = await window.awardGold(INITIAL_GOLD, 'initial_grant', { source: 'signup' });
          if (!ok) {
            console.error('[initial_grant] awardGold failed — 신규 가입 보상 적립 실패');
          }
        }
        // [PHASE_2A_NEW v3.1 §10-1] 신규 계정 칩 지급 제거 — 신규는 0칩 (ensurePlayer chip:0 default)
        // 칩은 PvP 보상 / $9.99 패스(우편함) / 환전(gold→chip)으로만 획득
      }
      msgEl.textContent = i18n.t('toast.registerComplete');
      msgEl.style.color = '#4CAF50';
      setTimeout(() => { window.location.href = 'mode_select.html'; }, 800);
    } catch (err) {
      msgEl.textContent = i18n.t('toast.errorOccurred');
      msgEl.style.color = '#ff5252';
    }
  }

  // Enter 키 지원
  document.getElementById('idInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') registerPlayer();
  });

  showState();
</script>
</body>
</html>
