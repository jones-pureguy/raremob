<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>DragON POKER - PvP Lobby</title>
<link rel="stylesheet" href="style.css">
<style>
  .lobby-container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 16px;
    position: relative;
    z-index: 1;
  }
  .lobby-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
  }

  /* ── 매칭 버튼 ── */
  .match-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .match-btn {
    flex: 1;
    padding: 14px 8px;
    border-radius: 10px;
    border: 1.5px solid rgba(201,168,76,0.3);
    background: rgba(201,168,76,0.1);
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .match-btn:hover { background: rgba(201,168,76,0.2); }
  .match-btn:active { transform: scale(0.97); }
  .match-btn.active {
    background: rgba(255,82,82,0.15);
    border-color: rgba(255,82,82,0.4);
    color: #ff5252;
    animation: matchPulse 1.5s ease-in-out infinite;
  }
  @keyframes matchPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* ── 접속자 리스트 ── */
  .lobby-section-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.1em;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-top: 8px;
  }
  .lobby-user {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .lobby-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .lobby-status-dot.waiting { background: #4CAF50; }
  .lobby-status-dot.matching { background: #FFC107; }
  .lobby-status-dot.playing { background: #ff5252; }
  .lobby-username {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: #e0e0e0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lobby-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .lobby-chip img {
    width: 14px;
    height: 14px;
    object-fit: contain;
  }
  .lobby-challenge-btn {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(201,168,76,0.3);
    background: rgba(201,168,76,0.12);
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .lobby-challenge-btn:hover { background: rgba(201,168,76,0.25); }
  .lobby-challenge-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .lobby-empty {
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-size: 0.8rem;
    padding: 24px 0;
  }

  /* ── 팝업 공통 ── */
  .pvp-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    justify-content: center;
    align-items: center;
  }
  .pvp-overlay.active { display: flex; }
  .pvp-popup {
    background: linear-gradient(145deg, #1a3a22, #0d2818);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 24px 20px;
    max-width: 340px;
    width: 90%;
    text-align: center;
    box-shadow: 0 0 40px rgba(201,168,76,0.2);
  }
  .pvp-popup-title {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 1.1rem;
    margin-bottom: 14px;
  }
  .pvp-popup-btn {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid rgba(201,168,76,0.3);
    background: rgba(255,255,255,0.08);
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .pvp-popup-btn:hover { background: rgba(201,168,76,0.15); }
  .pvp-popup-btn.reject {
    color: rgba(255,255,255,0.5);
    border-color: rgba(255,255,255,0.15);
  }
  .pvp-popup-countdown {
    color: rgba(255,255,255,0.4);
    font-size: 0.75rem;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

<div class="back-fixed"><a href="mode_select.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div class="header">
  <div id="global-header"></div>
</div>

<div class="lobby-container">
  <div class="lobby-title" id="lobbyTitle">PvP 로비</div>

  <div class="match-buttons" id="matchButtons"></div>

  <div id="lobbyList"></div>
</div>

<!-- 직접 신청 모드 선택 팝업 -->
<div class="pvp-overlay" id="challengeOverlay">
  <div class="pvp-popup">
    <div class="pvp-popup-title" id="challengeTitle"></div>
    <button class="pvp-popup-btn" onclick="sendChallenge('arcade')" id="challengeArcadeBtn">ARCADE BATTLE</button>
    <button class="pvp-popup-btn" onclick="sendChallenge('gamble')" id="challengeGambleBtn">GAMBLE DUEL</button>
    <button class="pvp-popup-btn reject" onclick="closeChallengePopup()"></button>
  </div>
</div>

<!-- 신청 수신 팝업 -->
<div class="pvp-overlay" id="receivedOverlay">
  <div class="pvp-popup">
    <div class="pvp-popup-title" id="receivedTitle"></div>
    <button class="pvp-popup-btn" id="receivedAcceptBtn" onclick="acceptChallenge()"></button>
    <button class="pvp-popup-btn reject" id="receivedRejectBtn" onclick="rejectChallenge()"></button>
    <div class="pvp-popup-countdown" id="receivedCountdown"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="header.js"></script>
<script src="sound.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="server_client.js"></script>
<script>
  // ─── 상태 ───
  let lobbyUsers = [];        // 전체 로비 유저 목록
  let matchingMode = null;    // 현재 매칭 중인 모드 ('arcade'|'gamble'|null)
  let challengeTarget = null; // 직접 신청 대상 socketId
  let pendingChallenge = null; // 수신된 신청 정보
  let challengeTimer = null;
  let heartbeatInterval = null;

  // ─── 초기화 ───
  (async () => {
    await i18n.init();
    initHeader();

    // UI 텍스트 설정
    document.getElementById('lobbyTitle').textContent = i18n.t('pvp.lobby.title');
    renderMatchButtons('idle', null);

    // 소켓 연결 완료 후 로비 진입
    if (socket.connected) {
      joinLobby();
    } else {
      socket.on('connect', joinLobby);
    }
  })();

  function joinLobby() {
    const playerId = localStorage.getItem('poker_player_id');
    const username = localStorage.getItem('poker_username');
    const chip = parseInt(localStorage.getItem('userChip') || '0');

    socket.emit('lobby:join', { playerId, username, chip });

    // heartbeat 시작
    heartbeatInterval = setInterval(() => {
      socket.emit('heartbeat');
    }, 3000);
  }

  // ─── 토스트 ───
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ─── 소켓 수신 이벤트 ───

  // lobby:list — 전체 리스트 수신
  socket.on('lobby:list', (list) => {
    lobbyUsers = list;
    renderLobby();
  });

  // lobby:userJoined — 유저 추가
  socket.on('lobby:userJoined', (user) => {
    lobbyUsers.push(user);
    renderLobby();
  });

  // lobby:userLeft — 유저 제거
  socket.on('lobby:userLeft', (socketId) => {
    lobbyUsers = lobbyUsers.filter(u => u.socketId !== socketId);
    renderLobby();
  });

  // lobby:statusChanged — 상태 변경
  socket.on('lobby:statusChanged', ({ socketId, status }) => {
    const user = lobbyUsers.find(u => u.socketId === socketId);
    if (user) user.status = status;
    renderLobby();
  });

  // challenge:received — 신청 수신
  socket.on('challenge:received', ({ fromSocketId, fromUsername, fromChip, mode }) => {
    pendingChallenge = { fromSocketId, fromUsername, fromChip, mode };
    showReceivedPopup();
  });

  // challenge:rejected — 거절됨
  socket.on('challenge:rejected', () => {
    showToast(i18n.t('pvp.lobby.rejected'));
  });

  // challenge:failed — 신청 실패
  socket.on('challenge:failed', ({ reason }) => {
    showToast(i18n.t('pvp.lobby.unavailable'));
  });

  // room:created — 매칭 완료
  socket.on('room:created', ({ roomId, mode, opponent }) => {
    matchingMode = null;
    renderMatchButtons('idle', null);
    sessionStorage.setItem('pvpRoom', JSON.stringify({ roomId, mode, opponent }));
    if (mode === 'arcade') {
      location.href = `pvp_arcade.html?room=${roomId}`;
    } else {
      location.href = `pvp_gamble.html?room=${roomId}`;
    }
  });

  // ─── 로비 렌더링 ───
  function renderLobby() {
    const container = document.getElementById('lobbyList');
    const myId = socket.id;

    const others = lobbyUsers.filter(u => u.socketId !== myId);
    const waiting = others.filter(u => u.status === 'waiting');
    const matching = others.filter(u => u.status === 'matching');
    const playing = others.filter(u => u.status === 'playing');

    let html = '';

    // 대기 중
    html += `<div class="lobby-section-title">── ${i18n.t('pvp.lobby.waiting')} (${waiting.length}) ──</div>`;
    if (waiting.length === 0 && matching.length === 0 && playing.length === 0) {
      html += `<div class="lobby-empty">...</div>`;
    }
    waiting.forEach(u => {
      const canChallenge = !matchingMode && u.chip >= 100;
      html += renderUserRow(u, 'waiting', canChallenge);
    });

    // 매칭 중
    if (matching.length > 0) {
      html += `<div class="lobby-section-title">── ${i18n.t('pvp.lobby.matching')} (${matching.length}) ──</div>`;
      matching.forEach(u => html += renderUserRow(u, 'matching', false));
    }

    // 대전 중
    if (playing.length > 0) {
      html += `<div class="lobby-section-title">── ${i18n.t('pvp.lobby.playing')} (${playing.length}) ──</div>`;
      playing.forEach(u => html += renderUserRow(u, 'playing', false));
    }

    container.innerHTML = html;
  }

  function renderUserRow(user, status, showChallengeBtn) {
    const chipHtml = `<div class="lobby-chip"><img src="./images/chip.png" alt="chip" onerror="this.style.display='none'">${user.chip.toLocaleString()}</div>`;
    const btnHtml = showChallengeBtn
      ? `<button class="lobby-challenge-btn" onclick="openChallengePopup('${user.socketId}','${user.username}')">${i18n.t('pvp.lobby.challenge')}</button>`
      : '';
    return `
      <div class="lobby-user">
        <div class="lobby-status-dot ${status}"></div>
        <div class="lobby-username">${user.username}</div>
        ${chipHtml}
        ${btnHtml}
      </div>`;
  }

  // ─── 매칭 버튼 렌더링 ───
  function renderMatchButtons(status, mode) {
    const container = document.getElementById('matchButtons');
    if (status === 'matching') {
      const modeName = mode === 'arcade' ? i18n.t('pvp.lobby.arcadeBattle') : i18n.t('pvp.lobby.gambleDuel');
      container.innerHTML = `
        <button class="match-btn active" onclick="toggleMatch(null)" style="flex:1;">${i18n.t('pvp.lobby.cancelMatch')}</button>
      `;
    } else {
      container.innerHTML = `
        <button class="match-btn" onclick="toggleMatch('arcade')">${i18n.t('pvp.lobby.arcadeMatch')}</button>
        <button class="match-btn" onclick="toggleMatch('gamble')">${i18n.t('pvp.lobby.gambleMatch')}</button>
      `;
    }
  }

  // ─── 자동매칭 ───
  function toggleMatch(mode) {
    if (matchingMode) {
      // 취소
      socket.emit('match:cancel');
      matchingMode = null;
      renderMatchButtons('idle', null);
    } else {
      // 시작
      matchingMode = mode;
      socket.emit('match:start', { mode });
      renderMatchButtons('matching', mode);
    }
    renderLobby();
  }

  // ─── 직접 신청 팝업 ───
  function openChallengePopup(targetId, targetName) {
    if (matchingMode) return;
    challengeTarget = targetId;
    document.getElementById('challengeTitle').textContent =
      i18n.t('pvp.lobby.challengeTo').replace('{name}', targetName);
    document.getElementById('challengeArcadeBtn').textContent = i18n.t('pvp.lobby.arcadeBattle');
    document.getElementById('challengeGambleBtn').textContent = i18n.t('pvp.lobby.gambleDuel');
    document.querySelector('#challengeOverlay .reject').textContent = i18n.t('pvp.lobby.cancel');
    document.getElementById('challengeOverlay').classList.add('active');
  }

  function closeChallengePopup() {
    document.getElementById('challengeOverlay').classList.remove('active');
    challengeTarget = null;
  }

  function sendChallenge(mode) {
    if (!challengeTarget) return;
    socket.emit('challenge:send', { targetSocketId: challengeTarget, mode });
    closeChallengePopup();

    // 7초 타임아웃
    clearTimeout(challengeTimer);
    challengeTimer = setTimeout(() => {
      showToast(i18n.t('pvp.lobby.rejected'));
    }, 7000);
  }

  // ─── 신청 수신 팝업 ───
  let receivedCountdownInterval = null;

  function showReceivedPopup() {
    if (!pendingChallenge) return;
    const { fromSocketId, fromUsername, fromChip, mode } = pendingChallenge;
    const modeName = mode === 'arcade' ? i18n.t('pvp.lobby.arcadeBattle') : i18n.t('pvp.lobby.gambleDuel');

    document.getElementById('receivedTitle').textContent =
      i18n.t('pvp.lobby.challengeFrom')
        .replace('{name}', fromUsername)
        .replace('{chip}', fromChip.toLocaleString())
        .replace('{mode}', modeName);
    document.getElementById('receivedAcceptBtn').textContent = i18n.t('pvp.lobby.accept');
    document.getElementById('receivedRejectBtn').textContent = i18n.t('pvp.lobby.reject');

    let remaining = 7;
    document.getElementById('receivedCountdown').textContent = `${remaining}s`;
    document.getElementById('receivedOverlay').classList.add('active');

    clearInterval(receivedCountdownInterval);
    receivedCountdownInterval = setInterval(() => {
      remaining--;
      document.getElementById('receivedCountdown').textContent = `${remaining}s`;
      if (remaining <= 0) {
        clearInterval(receivedCountdownInterval);
        rejectChallenge();
      }
    }, 1000);
  }

  function acceptChallenge() {
    if (!pendingChallenge) return;
    clearInterval(receivedCountdownInterval);
    socket.emit('challenge:accept', {
      fromSocketId: pendingChallenge.fromSocketId,
      mode: pendingChallenge.mode
    });
    document.getElementById('receivedOverlay').classList.remove('active');
    pendingChallenge = null;
  }

  function rejectChallenge() {
    if (!pendingChallenge) return;
    clearInterval(receivedCountdownInterval);
    socket.emit('challenge:reject', {
      fromSocketId: pendingChallenge.fromSocketId
    });
    document.getElementById('receivedOverlay').classList.remove('active');
    pendingChallenge = null;
  }

  // ─── 페이지 이탈 처리 ───
  window.addEventListener('beforeunload', () => {
    // 게임 매칭 후 이동 중이면 lobby:leave 발송 안 함
    if (!sessionStorage.getItem('pvpRoom')) {
      socket.emit('lobby:leave');
    }
    clearInterval(heartbeatInterval);
  });

  // 팝업 외부 클릭 닫기
  document.getElementById('challengeOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeChallengePopup();
  });
</script>
</body>
</html>
