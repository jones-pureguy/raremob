<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DragON POKER - Stage Select</title>
<link rel="stylesheet" href="style.css">
<style>
  .stage-select-header {
    text-align: center;
    margin-bottom: 8px;
  }
  .stage-select-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .stage-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 12px 0;
    width: 100%;
    box-sizing: border-box;
  }
  .stage-btn {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.8);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .stage-btn:hover { background: rgba(201,168,76,0.15); border-color: rgba(201,168,76,0.4); }
  .stage-btn.selected { border-color: var(--gold); background: rgba(201,168,76,0.2); box-shadow: 0 0 12px rgba(201,168,76,0.3); }
  .stage-btn.cleared {
    background: rgba(201,168,76,0.25);
    border-color: var(--gold);
    color: var(--gold);
    align-items: flex-start;
    justify-content: flex-start;
    padding: 4px 0 0 6px;
  }
  .stage-btn.cleared::after {
    content: '★';
    position: absolute;
    bottom: 3px;
    right: 4px;
    font-size: 0.85rem;
    color: var(--gold);
    text-shadow: 0 0 6px rgba(201,168,76,0.5);
  }
  .stage-btn.locked {
    background: rgba(255,255,255,0.02);
    border-color: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.2);
    cursor: pointer;
  }
  .stage-detail {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px;
    margin-top: 8px;
    min-height: 120px;
    width: 100%;
    box-sizing: border-box;
  }
  .stage-detail-title {
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 6px;
  }
  .stage-detail-desc {
    color: rgba(255,255,255,0.7);
    font-size: 0.85rem;
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .stage-detail-meta {
    color: rgba(255,255,255,0.4);
    font-size: 0.75rem;
    line-height: 1.6;
  }
  .stage-detail-meta span { color: rgba(255,255,255,0.6); }
  .stage-detail-reward {
    color: var(--gold);
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 8px;
  }
  .btn-challenge {
    display: block;
    width: 100%;
    max-width: 200px;
    margin: 16px auto 0;
    padding: 12px;
    background: rgba(201,168,76,0.2);
    border: 2px solid var(--gold);
    border-radius: 8px;
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-challenge:hover { background: rgba(201,168,76,0.35); }
  .btn-challenge:disabled { opacity: 0.3; cursor: not-allowed; }
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
    width: 100%;
  }
  .pagination button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: rgba(255,255,255,0.7);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pagination button:hover { background: rgba(201,168,76,0.15); border-color: rgba(201,168,76,0.4); }
  .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
  .pagination .page-info {
    color: rgba(255,255,255,0.5);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    min-width: 60px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

<div class="back-fixed"><a href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div class="menu-container">
  <div class="stage-select-header">
    <div class="stage-select-title">CHALLENGE MODE</div>
    <div id="global-header" style="display:flex;justify-content:center;"></div>
  </div>

  <div class="pagination" id="pagination"></div>
  <div class="stage-grid" id="stageGrid"></div>

  <div class="stage-detail" id="stageDetail">
    <div style="color:rgba(255,255,255,0.3);text-align:center;padding-top:30px;">스테이지를 선택하세요</div>
  </div>

  <button class="btn-challenge" id="btnChallenge" disabled onclick="startStage()">도전하기</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="header.js"></script>
<script src="sound.js"></script>
<script>
  let stages = [];
  let progress = { clearedStages: [] };
  let selectedStageId = null;
  i18n.init().then(() => initHeader());
  const PAGE_SIZE = 25;
  let currentPage = 1;
  let totalPages = 1;

  async function init() {
    // 1. 골드 표시는 header.js가 담당

    // 2. 즉시 로컬 진도 로드
    progress = JSON.parse(localStorage.getItem('poker_stage_progress') || '{"clearedStages":[]}');

    // Load stages.json (로컬 파일이므로 빠름)
    try {
      const res = await fetch('stages.json');
      stages = await res.json();
    } catch(e) { console.error('Failed to load stages.json'); return; }

    totalPages = Math.ceil(stages.length / PAGE_SIZE);

    // Auto-navigate to the page of the last progress stage
    if (progress.clearedStages.length > 0) {
      const maxCleared = Math.max(...progress.clearedStages);
      const nextStageId = maxCleared + 1;
      const targetId = nextStageId <= stages.length ? nextStageId : maxCleared;
      const stageIndex = stages.findIndex(s => s.id === targetId);
      if (stageIndex >= 0) {
        currentPage = Math.floor(stageIndex / PAGE_SIZE) + 1;
      }
    }

    renderPagination();
    renderStageGrid();

    // 3. 백그라운드에서 DB 싱크
    syncFromDB();
  }

  function syncFromDB() {
    const playerId = localStorage.getItem('poker_player_id');
    if (!playerId) return;

    // 골드 — header.js가 표시 담당
    _updateHeaderValues(true);

    // 진도 싱크 — DB 데이터가 로컬보다 많을 때만 병합
    sb.from('player_stages').select('*').eq('player_id', playerId)
      .then(({ data }) => {
        if (!data || data.length === 0) return; // DB에 데이터 없으면 로컬 유지
        const dbCleared = data.filter(s => s.cleared).map(s => s.stage_id);
        // 로컬과 DB를 병합 (union) — 어느 쪽도 잃지 않음
        const merged = [...new Set([...progress.clearedStages, ...dbCleared])];
        const p = {
          clearedStages: merged,
          stageData: data,
          lastSynced: new Date().toISOString(),
        };
        localStorage.setItem('poker_stage_progress', JSON.stringify(p));
        const oldIds = progress.clearedStages.sort().join(',');
        const newIds = merged.sort().join(',');
        if (oldIds !== newIds) {
          progress = p;
          renderStageGrid();
          if (selectedStageId) selectStage(selectedStageId);
        } else {
          progress = p;
        }
      })
      .then(result => { if (result && result.error) console.error('Stage progress sync failed:', result.error); });
  }

  function isUnlocked(stage) {
    if (stage.unlockCondition.type === 'none') return true;
    if (stage.unlockCondition.type === 'stage_clear') {
      return progress.clearedStages.includes(stage.unlockCondition.stageId);
    }
    return false;
  }

  function renderPagination() {
    const pag = document.getElementById('pagination');
    pag.innerHTML = `
      <button onclick="goPage(currentPage - 1)" ${currentPage <= 1 ? 'disabled' : ''}>◀</button>
      <span class="page-info">${currentPage} / ${totalPages}</span>
      <button onclick="goPage(currentPage + 1)" ${currentPage >= totalPages ? 'disabled' : ''}>▶</button>
    `;
  }

  function goPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    selectedStageId = null;
    document.getElementById('stageDetail').innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding-top:30px;">스테이지를 선택하세요</div>';
    document.getElementById('btnChallenge').disabled = true;
    document.getElementById('btnChallenge').textContent = '도전하기';
    renderPagination();
    renderStageGrid();
  }

  function renderStageGrid() {
    const grid = document.getElementById('stageGrid');
    grid.innerHTML = '';

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageStages = stages.slice(start, start + PAGE_SIZE);

    pageStages.forEach(stage => {
      const btn = document.createElement('button');
      btn.className = 'stage-btn';
      const cleared = progress.clearedStages.includes(stage.id);
      const unlocked = isUnlocked(stage);

      if (cleared) btn.classList.add('cleared');
      else if (!unlocked) btn.classList.add('locked');

      btn.textContent = unlocked ? stage.id : '🔒';
      btn.addEventListener('click', () => selectStage(stage.id));

      grid.appendChild(btn);
    });
  }

  function selectStage(id) {
    selectedStageId = id;
    const stage = stages.find(s => s.id === id);
    if (!stage) return;

    // Highlight selected button
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageStages = stages.slice(start, start + PAGE_SIZE);
    document.querySelectorAll('.stage-btn').forEach((btn, i) => {
      btn.classList.toggle('selected', pageStages[i] && pageStages[i].id === id);
    });

    const cleared = progress.clearedStages.includes(id);
    const constraints = stage.constraints;

    // Build constraints text
    let metaLines = [];
    if (stage.timers.gameTime !== 200) metaLines.push(`게임 시간: <span>${stage.timers.gameTime}초</span>`);
    if (stage.timers.stageTime) metaLines.push(`스테이지 시간: <span>${stage.timers.stageTime}초</span>`);
    if (constraints.resetLimit === 0) metaLines.push('리셋: <span>불가</span>');
    else if (constraints.resetLimit !== null) metaLines.push(`리셋: <span>${constraints.resetLimit}회</span>`);
    if (!constraints.jumpAllowed) metaLines.push('점프: <span>불가</span>');
    if (constraints.diagonalOnly) metaLines.push('이동: <span>대각선만</span>');
    else if (!constraints.diagonalAllowed) metaLines.push('이동: <span>직교만</span>');
    else if (constraints.moveMode === 'straight') metaLines.push('이동: <span>직선만</span>');
    if (constraints.forbiddenHands.length > 0) metaLines.push(`금지 족보: <span>${constraints.forbiddenHands.join(', ')}</span>`);
    if (constraints.forbiddenValues.length > 0) metaLines.push(`금지 숫자: <span>${constraints.forbiddenValues.join(', ')}</span>`);

    // Best score
    let bestLine = '';
    if (progress.stageData) {
      const sd = progress.stageData.find(d => d.stage_id === id);
      if (sd && sd.best_score > 0) bestLine = `<div style="color:var(--gold);font-size:0.8rem;margin-top:4px;">Best Score: ${sd.best_score}</div>`;
    }

    const detail = document.getElementById('stageDetail');
    detail.innerHTML = `
      <div class="stage-detail-title">${cleared ? '✓ ' : ''}Stage ${stage.id}: ${i18n.tField(stage.title)}</div>
      <div class="stage-detail-desc">${i18n.tField(stage.description)}</div>
      ${metaLines.length > 0 ? `<div class="stage-detail-meta">${metaLines.join('<br>')}</div>` : ''}
      <div class="stage-detail-reward">보상: <img src="./images/coin.png" alt="gold" class="currency-icon" style="width:16px;height:16px;vertical-align:middle;" onerror="this.style.display='none'"> ${stage.rewards.gold}${stage.rewards.bonus.length > 0 ? ' + 보너스' : ''}</div>
      ${bestLine}
    `;

    const unlocked = isUnlocked(stage);
    const btn = document.getElementById('btnChallenge');
    if (unlocked) {
      btn.disabled = false;
      btn.textContent = cleared ? '다시 도전' : '도전하기';
    } else {
      btn.disabled = true;
      btn.textContent = '🔒 잠김';
    }
  }

  function startStage() {
    if (!selectedStageId) return;
    window.location.href = `stage.html?id=${selectedStageId}`;
  }

  init();
</script>
</body>
</html>
