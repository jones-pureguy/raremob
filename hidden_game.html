<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>DragON POKER - Hidden</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<style>
  /* ── Hidden 버튼 스타일 ── */
  .hg-btn {
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(201,168,76,0.4);
    background: rgba(255,255,255,0.08);
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    touch-action: manipulation;
  }
  .hg-btn:active { transform: scale(0.96); }
  .hg-btn.shuffle {
    background: rgba(255,77,143,0.12);
    border-color: rgba(255,77,143,0.4);
    color: #ff6ba3;
  }
  .hg-btn.shuffle:disabled { opacity: 0.35; cursor: not-allowed; }
  .hg-btn .cost-badge {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    padding: 1px 5px;
  }
  /* ── Hidden START 오버레이 ── */
  #hgStartOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #hgStartOverlay .hg-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: #ff4d8f;
    letter-spacing: 0.1em;
    text-shadow: 0 0 30px rgba(255,77,143,0.6);
  }
  #hgStartOverlay .hg-subtitle {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.12em;
  }

  #hgStartOverlay .hg-rule {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.3);
    line-height: 1.7;
    text-align: center;
    max-width: 280px;
  }
  #hgStartOverlay .hg-start-btn {
    margin-top: 8px;
    padding: 14px 48px;
    background: rgba(255,77,143,0.15);
    border: 2px solid #ff4d8f;
    border-radius: 12px;
    color: #ff4d8f;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }
  #hgStartOverlay .hg-start-btn:active { transform: scale(0.97); }
</style>
</head>
<body class="game-page hidden-stage">
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

<div class="back-fixed"><a href="mode_select.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div class="header">
  <div id="global-header"></div>
</div>

<!-- 상태 바: 점수 + 패 카운터 + 버튼 (타이머 없음) -->
<div class="status-bar">
  <div class="score-display">
    <div class="current-score" id="currentScore">0</div>
    <div class="high-score">HI <span id="highScoreDisplay">0</span></div>
  </div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:rgba(255,107,163,0.7);font-weight:700;letter-spacing:0.06em;">
    HAND <span id="handCountStatus">0</span> / 9
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <button class="hg-btn shuffle" id="shuffleBtn" title="셔플 (100골드)">⇄ <span class="cost-badge">100G</span></button>
    <button class="hg-btn" id="restartBtn" title="리스타트 (20골드)">↺ <span class="cost-badge">20G</span></button>
  </div>
</div>

<!-- 7×7 그리드 (script.js가 렌더) -->
<div class="grid-container" id="gridContainer">
  <div class="grid" id="grid"></div>
  <svg class="drag-svg" id="dragSvg"><polyline class="drag-line" id="dragLine" points=""/></svg>
  <div class="no-moves-overlay" id="noMovesOverlay">NO MORE MOVES</div>
</div>

<div class="hand-preview" id="handPreview"></div>

<div class="hand-panel">
  <div class="hand-panel-title">COLLECTED <span>[ <span id="handCount">0</span> / 9 ]</span></div>
  <div class="hand-slots" id="handSlots"></div>
</div>

<div class="removed-panel">
  <div class="removed-panel-title">REMOVED</div>
  <div class="removed-cards" id="removedCards"></div>
</div>

<!-- 게임 종료 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<!-- 더미 (script.js 호환용) -->
<div class="modal-overlay" id="leaderboardOverlay">
  <div class="modal leaderboard-modal" id="leaderboardModal"></div>
</div>
<div id="qrOverlay" style="display:none">
  <div class="qr-modal"><div class="qr-scroll"><div id="qrHandList"></div></div></div>
</div>
<div style="display:none">
  <span id="retryLabel"></span>
  <button id="btnSaveReplay"></button>
  <div id="allUserTopScoreRow"></div>
  <div id="usernameDisplay"></div>
  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 40 40">
      <circle class="timer-ring-bg" cx="20" cy="20" r="16"/>
      <circle class="timer-ring-fg" id="timerRing" cx="20" cy="20" r="16" stroke-dasharray="100.53" stroke-dashoffset="0" transform="rotate(-90 20 20)"/>
    </svg>
    <div class="timer-num" id="timerNum">0</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Scripts -->

<script>
  // [Phase 1-7.5-B] 히든 전용 플래그 — script.js의 자동 시작(BGM + startOverlay + basic session)
  // 진입을 비활성화. 히든 모드는 자체적으로 세션/BGM/오버레이를 관리한다 (hidden_script.js).
  // _pvpMode 플래그 재사용 이유: script.js 수정 금지 원칙. 실제로는 PvP 아님.
  window._pvpMode = true;
  // Gold helpers (game.html과 동일)
  function getGoldLocal() { return parseInt(localStorage.getItem('poker_gold') || '0'); }
  function deductGoldLocal(amount, reason) {
    const cur = getGoldLocal();
    if (cur < amount) return false;
    localStorage.setItem('poker_gold', cur - amount);
    if (typeof _updateHeaderValues === 'function') _updateHeaderValues(true);
    return true;
  }
  function renderCurrencyBar() {
    if (typeof _updateHeaderValues === 'function') _updateHeaderValues(true);
  }
  function updateRestartButtonState() {}
  // [ADAPTER] 골드 DB 싱크 — Render 서버 경유 (전역 스코프)
  // server_client.js 로드 후 정의해야 syncGoldToServer 참조 가능
  async function syncGoldToDB(reason) {
    const playerId = localStorage.getItem('poker_player_id');
    if (!playerId) return;
    const gold = parseInt(localStorage.getItem('poker_gold') || '0');
    await syncGoldToServer(playerId, gold);
  }
</script>
<script>
(async () => {
  if (!requireRegistration()) return;
  await i18n.init();
  initHeader();
  await ScorePolicy.load();
})().then(() => {
  const s = document.createElement('script');
  s.src = 'script.js';
  document.body.appendChild(s);
  s.onload = () => {
    const h = document.createElement('script');
    h.src = 'hidden_script.js';
    document.body.appendChild(h);
  };
});
</script>

<!-- Hidden START 오버레이 -->
<div id="hgStartOverlay">
  <div class="hg-title">HIDDEN GAME</div>

  <div class="hg-rule">
