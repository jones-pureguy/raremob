<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DragON POKER - DB Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Mono', monospace; background: #0d1f13; color: #e0e0e0; padding: 24px; }
  h1 { color: #c9a84c; margin-bottom: 20px; font-size: 1.4rem; }
  h2 { color: #c9a84c; margin: 20px 0 10px; font-size: 1rem; }
  .section { background: rgba(255,255,255,0.05); border: 1px solid rgba(201,168,76,0.3); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  input { background: rgba(255,255,255,0.08); border: 1px solid rgba(201,168,76,0.3); color: #c9a84c; font-family: inherit; font-size: 0.9rem; padding: 8px 12px; border-radius: 6px; outline: none; width: 200px; }
  button { background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.4); color: #c9a84c; font-family: inherit; font-size: 0.85rem; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  button:hover { background: rgba(201,168,76,0.25); }
  button.danger { color: #ff5252; border-color: rgba(255,82,82,0.4); background: rgba(255,82,82,0.1); }
  button.danger:hover { background: rgba(255,82,82,0.2); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
  th { color: #c9a84c; font-size: 0.75rem; text-transform: uppercase; }
  .log { background: rgba(0,0,0,0.3); border-radius: 6px; padding: 12px; margin-top: 12px; font-size: 0.8rem; max-height: 150px; overflow-y: auto; white-space: pre-wrap; color: #8bc34a; }
  .log.error { color: #ff5252; }
  .empty { color: rgba(255,255,255,0.3); padding: 12px; }
</style>
</head>
<body>

<h1>DragON POKER - DB Test</h1>

<!-- Player Insert -->
<div class="section">
  <h2>Player 등록</h2>
  <div class="row">
    <input id="usernameInput" type="text" placeholder="username" maxlength="12">
    <button onclick="insertPlayer()">등록</button>
  </div>
  <div class="log" id="insertLog"></div>
</div>

<!-- Players List -->
<div class="section">
  <h2>Players 조회</h2>
  <div class="row">
    <button onclick="loadPlayers()">조회</button>
  </div>
  <div id="playersTable"></div>
</div>

<!-- Game Sessions -->
<div class="section">
  <h2>Game Sessions 조회</h2>
  <div class="row">
    <button onclick="loadSessions()">조회</button>
  </div>
  <div id="sessionsTable"></div>
</div>

<!-- Leaderboard -->
<div class="section">
  <h2>Leaderboard 조회</h2>
  <div class="row">
    <button onclick="loadLeaderboard()">조회</button>
  </div>
  <div id="leaderboardTable"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function log(elId, msg, isError) {
    const el = document.getElementById(elId);
    el.textContent = msg;
    el.className = 'log' + (isError ? ' error' : '');
  }

  async function insertPlayer() {
    const username = document.getElementById('usernameInput').value.trim();
    if (!username) { log('insertLog', 'username을 입력하세요', true); return; }

    // Check if exists
    const { data: existing, error: fetchErr } = await sb
      .from('players')
      .select('id, username, created_at')
      .eq('username', username)
      .maybeSingle();

    if (fetchErr) { log('insertLog', 'Error: ' + JSON.stringify(fetchErr), true); return; }

    if (existing) {
      log('insertLog', '이미 존재하는 유저입니다:\n' + JSON.stringify(existing, null, 2));
      return;
    }

    const { data, error } = await sb
      .from('players')
      .insert({ username })
      .select()
      .single();

    if (error) { log('insertLog', 'Insert Error: ' + JSON.stringify(error), true); return; }
    log('insertLog', '등록 성공:\n' + JSON.stringify(data, null, 2));
    document.getElementById('usernameInput').value = '';
  }

  async function deletePlayer(id, username) {
    if (!confirm(username + ' 을(를) 삭제하시겠습니까?')) return;

    // Delete related leaderboard entries
    await sb.from('leaderboard').delete().eq('player_id', id);
    // Delete related game sessions
    await sb.from('game_sessions').delete().eq('player_id', id);
    // Delete player
    const { error } = await sb.from('players').delete().eq('id', id);

    if (error) { alert('삭제 실패: ' + JSON.stringify(error)); return; }
    loadPlayers();
  }

  async function loadPlayers() {
    const { data: rows, error } = await sb
      .from('players')
      .select('id, username, created_at')
      .order('created_at', { ascending: false });

    const el = document.getElementById('playersTable');
    if (error) { el.innerHTML = '<div class="log error">' + JSON.stringify(error) + '</div>'; return; }
    if (!rows || rows.length === 0) { el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }

    let html = '<table><thead><tr><th>ID</th><th>Username</th><th>Created</th><th></th></tr></thead><tbody>';
    rows.forEach(r => {
      const created = new Date(r.created_at).toLocaleString('ko-KR');
      html += `<tr>
        <td style="font-size:0.7rem;color:rgba(255,255,255,0.4)">${r.id.substring(0,8)}...</td>
        <td>${r.username}</td>
        <td>${created}</td>
        <td><button class="danger" onclick="deletePlayer('${r.id}','${r.username}')">삭제</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  async function deleteSession(id) {
    const { error } = await sb.from('game_sessions').delete().eq('id', id);
    if (error) { alert('삭제 실패: ' + JSON.stringify(error)); return; }
    loadSessions();
  }

  async function loadSessions() {
    const { data: rows, error } = await sb
      .from('game_sessions')
      .select('id, player_id, score, best_hand, hands_collected, time_remaining, completed, created_at')
      .order('created_at', { ascending: false })
      .limit(20);

    const el = document.getElementById('sessionsTable');
    if (error) { el.innerHTML = '<div class="log error">' + JSON.stringify(error) + '</div>'; return; }
    if (!rows || rows.length === 0) { el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }

    let html = '<table><thead><tr><th>Player</th><th>Score</th><th>Best Hand</th><th>Hands</th><th>Time</th><th>Created</th><th></th></tr></thead><tbody>';
    rows.forEach(r => {
      const created = new Date(r.created_at).toLocaleString('ko-KR');
      const pid = r.player_id ? r.player_id.substring(0,8) + '...' : '-';
      html += `<tr>
        <td style="font-size:0.7rem;color:rgba(255,255,255,0.4)">${pid}</td>
        <td>${r.score}</td>
        <td>${r.best_hand || '-'}</td>
        <td>${r.hands_collected}</td>
        <td>${r.time_remaining}</td>
        <td>${created}</td>
        <td><button class="danger" onclick="deleteSession('${r.id}')">삭제</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  async function deleteLeaderboardEntry(id) {
    const { error } = await sb.from('leaderboard').delete().eq('id', id);
    if (error) { alert('삭제 실패: ' + JSON.stringify(error)); return; }
    loadLeaderboard();
  }

  async function loadLeaderboard() {
    const { data: rows, error } = await sb
      .from('leaderboard')
      .select('id, player_id, username, score, best_hand, created_at')
      .order('score', { ascending: false });

    const el = document.getElementById('leaderboardTable');
    if (error) { el.innerHTML = '<div class="log error">' + JSON.stringify(error) + '</div>'; return; }
    if (!rows || rows.length === 0) { el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }

    let html = '<table><thead><tr><th>#</th><th>Username</th><th>Score</th><th>Best Hand</th><th>Created</th><th></th></tr></thead><tbody>';
    rows.forEach((r, i) => {
      const created = new Date(r.created_at).toLocaleString('ko-KR');
      html += `<tr>
        <td>${i + 1}</td>
        <td>${r.username}</td>
        <td>${r.score}</td>
        <td>${r.best_hand || '-'}</td>
        <td>${created}</td>
        <td><button class="danger" onclick="deleteLeaderboardEntry('${r.id}')">삭제</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  // Auto-load on page open
  loadPlayers();
  loadSessions();
  loadLeaderboard();
</script>
</body>
</html>
