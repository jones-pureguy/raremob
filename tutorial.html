<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>DragON POKER - Tutorial</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="./style.css">
<style>
  /* 튜토리얼 그리드: 셀 사이 간격 제거, 가운데 정렬 */
  .tutorial-body .tut-grid-area .grid-container {
    width: fit-content !important;
    max-width: 100% !important;
    margin: 0 auto !important;
  }
  .tutorial-body .tut-grid-area .grid {
    width: fit-content;
    gap: 4px;
    justify-content: center;
  }
</style>
</head>
<body class="tutorial-body">
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

  <!-- 상단 진행 바 -->
  <div class="tut-header">
    <span class="tut-progress" id="tutProgress">1 / 10</span>
  </div>

  <!-- 그리드 영역 -->
  <div class="tut-grid-area">
    <div class="grid-container" id="gridContainer">
      <!-- 그리드 상단 툴바: SKIP(좌) / 재시도(우) — Phase 1-11.1 -->
      <div class="tut-grid-toolbar">
        <button class="tut-skip-btn" id="tutSkipBtn" onclick="skipTutorial()">SKIP</button>
        <button class="tut-restart-btn" id="tutRestartBtn" onclick="tutorialRestart()" disabled>↺<span class="tut-retry-label" id="tutRetryLabel">재시도</span></button>
      </div>
      <div class="grid" id="grid"></div>
      <svg class="drag-svg" id="dragSvg"><polyline class="drag-line" id="dragLine" points="" /></svg>
      <!-- 핸드 프리뷰 -->
      <div class="hand-preview" id="handPreview"></div>
    </div>

    <!-- 대화 오버레이 (그리드 위에 뜨는 반투명 패널) -->
    <div class="tut-dialog-overlay" id="tutDialogOverlay">
      <div class="tut-dialog-inner">
        <div class="tut-character">
          <img src="./images/portrait.webp" alt="Dragon" class="tut-dragon-img">
        </div>
        <div class="tut-bubble">
          <p class="tut-dialog-text" id="tutDialogText"></p>
          <button class="tut-next-btn" id="tutNextBtn">NEXT ▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- instruction phase용 하단 힌트 -->
  <div class="tut-action-prompt" id="tutActionPrompt">
    <span class="tut-action-arrow">↑</span>
    <span class="tut-action-text" id="tutActionText">드래그 해보세요!</span>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="./auth.js"></script>
<script src="./i18n.js"></script>
<script src="./sound.js"></script>
<script src="./scorepolicy.js"></script>
<script src="./prng.js"></script>
<script>
(async () => {
  await i18n.init();
  // Phase 1-11.1: tut-toolbar 재시도 라벨 i18n 적용
  const retryEl = document.getElementById('tutRetryLabel');
  if (retryEl) retryEl.textContent = i18n.t('tutorial.retry') || '재시도';
  await ScorePolicy.load();
})().then(() => {
  const s = document.createElement('script');
  s.src = './tutorial_script.js';
  document.body.appendChild(s);
});
</script>
<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div class="start-title">DragON POKER</div>
    <div class="start-subtitle">Tutorial</div>
    <button class="start-btn" id="startBtn">▶ START</button>
  </div>
</div>
</body>
</html>
