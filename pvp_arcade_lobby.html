<style>
  /* ── 로비 ── */
  .lobby-container { width:100%; max-width:480px; margin:0 auto; padding:12px 16px; position:relative; z-index:1; }
  .lobby-title { font-family:'Playfair Display',serif; font-size:1.4rem; color:var(--gold); font-weight:700; text-align:center; margin-bottom:12px; }
  .match-buttons { display:flex; gap:8px; margin-bottom:16px; }
  .match-btn { flex:1; padding:14px 8px; border-radius:10px; border:1.5px solid rgba(201,168,76,0.3); background:rgba(201,168,76,0.1); color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:0.75rem; font-weight:700; letter-spacing:0.05em; cursor:pointer; transition:all 0.15s; text-align:center; }
  .match-btn:hover { background:rgba(201,168,76,0.2); }
  .match-btn:active { transform:scale(0.97); }
  .match-btn.active { background:rgba(255,82,82,0.15); border-color:rgba(255,82,82,0.4); color:#ff5252; animation:matchPulse 1.5s ease-in-out infinite; }
  @keyframes matchPulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }
  .lobby-section-title { font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:rgba(255,255,255,0.35); letter-spacing:0.1em; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.06); margin-top:8px; }
  .lobby-user { display:flex; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px solid rgba(255,255,255,0.04); }
  .lobby-status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .lobby-status-dot.waiting { background:#4CAF50; }
  .lobby-status-dot.matching { background:#FFC107; }
  .lobby-status-dot.playing { background:#ff5252; }
  .lobby-username { flex:1; font-family:'IBM Plex Mono',monospace; font-size:0.85rem; color:#e0e0e0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lobby-chip { font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--gold); display:flex; align-items:center; gap:3px; flex-shrink:0; }
  .lobby-chip img { width:14px; height:14px; object-fit:contain; }
  .lobby-challenge-btn { padding:4px 10px; border-radius:6px; border:1px solid rgba(201,168,76,0.3); background:rgba(201,168,76,0.12); color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:0.7rem; font-weight:600; cursor:pointer; flex-shrink:0; }
  .lobby-challenge-btn:hover { background:rgba(201,168,76,0.25); }
  .lobby-challenge-btn:disabled { opacity:0.3; cursor:not-allowed; }
  .lobby-empty { text-align:center; color:rgba(255,255,255,0.2); font-size:0.8rem; padding:24px 0; }
  /* ── 팝업 ── */
  .pvp-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200; justify-content:center; align-items:center; }
  .pvp-overlay.active { display:flex; }
  .pvp-popup { background:linear-gradient(145deg,#1a3a22,#0d2818); border:2px solid var(--gold); border-radius:16px; padding:24px 20px; max-width:340px; width:90%; text-align:center; box-shadow:0 0 40px rgba(201,168,76,0.2); }
  .pvp-popup-title { font-family:'Playfair Display',serif; color:var(--gold); font-size:1.1rem; margin-bottom:14px; }
  .pvp-popup-btn { width:100%; padding:12px; margin-top:6px; border-radius:8px; border:1px solid rgba(201,168,76,0.3); background:rgba(255,255,255,0.08); color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:0.85rem; font-weight:600; cursor:pointer; }
  .pvp-popup-btn:hover { background:rgba(201,168,76,0.15); }
  .pvp-popup-btn.reject { color:rgba(255,255,255,0.5); border-color:rgba(255,255,255,0.15); }
  .pvp-popup-countdown { color:rgba(255,255,255,0.4); font-size:0.75rem; margin-top:8px; }
  /* ── 게임 ── */
  .pvp-opponent-bar { display:flex; align-items:center; justify-content:space-between; padding:4px 16px; font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:rgba(255,255,255,0.6); max-width:500px; width:100%; margin:0 auto; }
  .pvp-opp-name { color:var(--gold); font-weight:700; }
  .pvp-opp-chip { display:flex; align-items:center; gap:3px; }
  .pvp-opp-chip img { width:14px; height:14px; }
  .pvp-opp-hands { font-size:0.7rem; color:rgba(255,255,255,0.4); }
  .pvp-scoreboard { max-width:500px; width:100%; margin:4px auto; padding:0 16px; font-family:'IBM Plex Mono',monospace; font-size:0.68rem; }
  .pvp-sb-header { display:flex; justify-content:space-between; color:rgba(255,255,255,0.35); padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.1); font-weight:600; font-size:0.65rem; letter-spacing:0.05em; }
  .pvp-sb-row { display:flex; align-items:center; padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.03); min-height:18px; }
  .pvp-sb-cell { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pvp-sb-cell.left { text-align:left; color:rgba(255,255,255,0.6); }
  .pvp-sb-cell.right { text-align:right; color:rgba(255,255,255,0.6); }
  .pvp-sb-cell.vs { flex:0; width:20px; text-align:center; color:rgba(255,255,255,0.2); font-size:0.6rem; }
  .pvp-sb-cell .win { color:var(--gold); }
  .time-attack-banner { display:none; position:fixed; top:0; left:0; right:0; background:rgba(255,50,50,0.9); color:white; text-align:center; padding:8px; font-family:'IBM Plex Mono',monospace; font-size:0.9rem; font-weight:700; z-index:50; animation:bannerPulse 0.5s ease-in-out 3; }
  .time-attack-banner.active { display:block; }
  @keyframes bannerPulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }
  .timer-num.time-attack { color:#ff3333 !important; }
  .timer-ring-fg.time-attack { stroke:#ff3333 !important; }
  /* ── pvp-info-bar ── */
  .pvp-info-bar { display:flex; align-items:center; justify-content:space-around; padding:8px 16px; max-width:500px; width:100%; margin:4px auto 0; border-top:1px solid rgba(255,255,255,0.06); }
  .pvp-info-me, .pvp-info-opp { display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:0.78rem; }
  .pvp-info-label { color:rgba(255,255,255,0.4); font-size:0.65rem; font-weight:700; letter-spacing:0.1em; }
  .pvp-info-chip { display:flex; align-items:center; gap:3px; color:var(--gold); }
  .pvp-info-chip img { width:14px; height:14px; }
  .pvp-info-divider { color:rgba(255,255,255,0.1); font-size:1.2rem; }
  /* ── 상태메시지 ── */
  @keyframes pvpBlink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .pvp-status-blink { animation:pvpBlink 1s ease-in-out infinite; }
  .pvp-status-completed { color:#4CAF50 !important; }
  .pvp-status-oppdone { color:#FFC107 !important; }
  .pvp-status-timelimit { color:#ff5252 !important; }
</style>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
// =============================================
// 뷰 전환
// =============================================
function showView(name) {
  document.getElementById('view-lobby').style.display = name === 'lobby' ? '' : 'none';
  document.getElementById('view-game').style.display = name === 'game' ? '' : 'none';
  document.getElementById('backLink').href = name === 'lobby' ? 'mode_select.html' : '#';
  if (name === 'lobby') {
    document.getElementById('backLink').onclick = null;
  } else {
    document.getElementById('backLink').onclick = function(e) {
      e.preventDefault();
      // 게임 진행 중이면 뒤로가기 차단
      if (pvpArcade.gameStarted &&
          state.phase !== 'result' &&
          state.phase !== 'idle') {
        showToast('게임 중에는 로비로 이동할 수 없습니다.');
        return;
      }
      goToLobby();
    };
  }
  const header = document.getElementById('global-header');
  if (header && header.parentElement) header.parentElement.style.display = name === 'game' ? 'none' : '';
}

// =============================================
// 공통 상태
// =============================================
let lobbyUsers = [];
let matchingMode = null;
let challengeTarget = null;
let pendingChallenge = null;
let challengeTimer = null;
let heartbeatInterval = null;
let receivedCountdownInterval = null;

const pvpArcade = {
  roomId: null,
  opponent: null,
  myHands: [],
  opponentHands: [],
  gameStarted: false,
  rematchRequested: false,
  rematchTimer: null,
  disconnectTimeout: null
};

// =============================================
// 초기화
// =============================================
let scriptLoaded = false;

(async () => {
  await i18n.init();
  initHeader();
  await ScorePolicy.load();

  document.getElementById('lobbyTitle').textContent = i18n.t('pvp.lobby.title');
  renderMatchButtons('idle', null);

  // script.js 로드 (게임 엔진)
  await new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = 'script.js';
    s.onload = () => { scriptLoaded = true; resolve(); };
    document.body.appendChild(s);
  });

  // 로비 진입
  if (socket.connected) {
    joinLobby();
  } else {
    socket.once('connect', joinLobby);  // once로 변경 (1회만 실행)
  }
})();

// =============================================
// 로비 로직
// =============================================
function joinLobby() {
  const playerId = localStorage.getItem('poker_player_id');
  const username = localStorage.getItem('poker_username');
  const chip = parseInt(localStorage.getItem('userChip') || '0');
  socket.emit('lobby:join', { playerId, username, chip });
  clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(() => socket.emit('heartbeat'), 3000);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── 로비 소켓 이벤트 ───
socket.on('lobby:list', (list) => { lobbyUsers = list; renderLobby(); });
socket.on('lobby:userJoined', (user) => {
  const idx = lobbyUsers.findIndex(u => u.socketId === user.socketId);
  if (idx !== -1) {
    lobbyUsers[idx] = user;
  } else {
    lobbyUsers.push(user);
  }
  renderLobby();
});
socket.on('lobby:userLeft', (socketId) => { lobbyUsers = lobbyUsers.filter(u => u.socketId !== socketId); renderLobby(); });
socket.on('lobby:statusChanged', ({ socketId, status }) => {
  const user = lobbyUsers.find(u => u.socketId === socketId);
  if (user) user.status = status;
  renderLobby();
});

socket.on('challenge:received', ({ fromSocketId, fromUsername, fromChip, mode }) => {
  if (mode !== 'arcade') return;
  pendingChallenge = { fromSocketId, fromUsername, fromChip, mode };
  showReceivedPopup();
});
socket.on('challenge:rejected', () => { showToast(i18n.t('pvp.lobby.rejected')); });
socket.on('challenge:failed', () => { showToast(i18n.t('pvp.lobby.unavailable')); });

// ─── room:created → 게임 뷰 전환 ───
socket.on('room:created', ({ roomId, mode, opponent }) => {
  if (mode !== 'arcade') return;
  matchingMode = null;
  renderMatchButtons('idle', null);
  pvpArcade.roomId = roomId;
  pvpArcade.opponent = opponent;
  pvpArcade.myHands = [];
  pvpArcade.opponentHands = [];
  pvpArcade.gameStarted = false;
  pvpArcade.rematchRequested = false;
  clearTimeout(pvpArcade.rematchTimer);
  showView('game');
  setupGameUI();
});

function renderLobby() {
  const container = document.getElementById('lobbyList');
  const myId = socket.id;
  const others = lobbyUsers.filter(u => u.socketId !== myId);
  const waiting = others.filter(u => u.status === 'waiting');
  const matching = others.filter(u => u.status === 'matching');
  const playing = others.filter(u => u.status === 'playing');

  let html = `<div class="lobby-section-title">── ${i18n.t('pvp.lobby.waiting')} (${waiting.length}) ──</div>`;
  if (waiting.length === 0 && matching.length === 0 && playing.length === 0) {
    html += `<div class="lobby-empty">...</div>`;
  }
  waiting.forEach(u => {
    const canChallenge = !matchingMode && u.chip >= 100;
    html += renderUserRow(u, 'waiting', canChallenge);
  });
  if (matching.length > 0) {
    html += `<div class="lobby-section-title">── ${i18n.t('pvp.lobby.matching')} (${matching.length}) ──</div>`;
    matching.forEach(u => html += renderUserRow(u, 'matching', false));
  }
  if (playing.length > 0) {
    html += `<div class="lobby-section-title">── ${i18n.t('pvp.lobby.playing')} (${playing.length}) ──</div>`;
    playing.forEach(u => html += renderUserRow(u, 'playing', false));
  }
  container.innerHTML = html;
}

function renderUserRow(user, status, showBtn) {
  const chipHtml = `<div class="lobby-chip"><img src="./images/chip.png" alt="chip" onerror="this.style.display='none'">${user.chip.toLocaleString()}</div>`;
  const btnHtml = showBtn
    ? `<button class="lobby-challenge-btn" onclick="sendDirectChallenge('${user.socketId}')">${i18n.t('pvp.lobby.challenge')}</button>`
    : '';
  return `<div class="lobby-user"><div class="lobby-status-dot ${status}"></div><div class="lobby-username">${user.username}</div>${chipHtml}${btnHtml}</div>`;
}

function renderMatchButtons(status) {
  const container = document.getElementById('matchButtons');
  if (status === 'matching') {
    container.innerHTML = `<button class="match-btn active" onclick="toggleMatch()">${i18n.t('pvp.lobby.cancelMatch')}</button>`;
  } else {
    container.innerHTML = `<button class="match-btn" onclick="toggleMatch()">${i18n.t('pvp.lobby.arcadeMatch')}</button>`;
  }
}

function toggleMatch() {
  if (matchingMode) {
    socket.emit('match:cancel');
    matchingMode = null;
    renderMatchButtons('idle');
  } else {
    matchingMode = 'arcade';
    socket.emit('match:start', { mode: 'arcade' });
    renderMatchButtons('matching');
  }
  renderLobby();
}

// 직접 신청 (모드 선택 없이 바로 arcade)
function sendDirectChallenge(targetId) {
  if (matchingMode) return;
  socket.emit('challenge:send', { targetSocketId: targetId, mode: 'arcade' });
  clearTimeout(challengeTimer);
  challengeTimer = setTimeout(() => showToast(i18n.t('pvp.lobby.rejected')), 7000);
}

function showReceivedPopup() {
  if (!pendingChallenge) return;
  const { fromUsername, fromChip } = pendingChallenge;
  const modeName = i18n.t('pvp.lobby.arcadeBattle');
  document.getElementById('receivedTitle').textContent =
    i18n.t('pvp.lobby.challengeFrom').replace('{name}', fromUsername).replace('{chip}', fromChip.toLocaleString()).replace('{mode}', modeName);
  document.getElementById('receivedAcceptBtn').textContent = i18n.t('pvp.lobby.accept');
  document.getElementById('receivedRejectBtn').textContent = i18n.t('pvp.lobby.reject');
  let remaining = 7;
  document.getElementById('receivedCountdown').textContent = `${remaining}s`;
  document.getElementById('receivedOverlay').classList.add('active');
  clearInterval(receivedCountdownInterval);
  receivedCountdownInterval = setInterval(() => {
    remaining--;
    document.getElementById('receivedCountdown').textContent = `${remaining}s`;
    if (remaining <= 0) { clearInterval(receivedCountdownInterval); rejectChallenge(); }
  }, 1000);
}

function acceptChallenge() {
  if (!pendingChallenge) return;
  clearInterval(receivedCountdownInterval);
  socket.emit('challenge:accept', { fromSocketId: pendingChallenge.fromSocketId, mode: 'arcade' });
  document.getElementById('receivedOverlay').classList.remove('active');
  pendingChallenge = null;
}

function rejectChallenge() {
  if (!pendingChallenge) return;
  clearInterval(receivedCountdownInterval);
  socket.emit('challenge:reject', { fromSocketId: pendingChallenge.fromSocketId });
  document.getElementById('receivedOverlay').classList.remove('active');
  pendingChallenge = null;
}

// =============================================
// [REUSE] 같은 rank 패끼리 세부 강도 비교 (양수=a강함)
function compareHandStrength(a, b) {
  if (!a.cards || !b.cards) {
    const SR = { '♠': 4, '♦': 3, '♥': 2, '♣': 1 };
    return (SR[a.suit] || 0) - (SR[b.suit] || 0);
  }
  const getKeys = (hand) => {
    const cards = hand.cards.slice().sort((x, y) => y.value - x.value);
    const counts = {};
    cards.forEach(c => counts[c.value] = (counts[c.value] || 0) + 1);
    const byCount = Object.entries(counts)
      .sort((x, y) => y[1] - x[1] || parseInt(y[0]) - parseInt(x[0]))
      .map(e => parseInt(e[0]));
    switch (hand.rank) {
      case 1: return [byCount[0], ...cards.filter(c => c.value !== byCount[0]).map(c => c.value)];
      case 2: return [byCount[0], byCount[1], ...cards.filter(c => c.value !== byCount[0] && c.value !== byCount[1]).map(c => c.value)];
      case 3: return [byCount[0], ...cards.filter(c => c.value !== byCount[0]).map(c => c.value)];
      case 4: case 8: {
        if (cards[0].value === 14 && cards[1].value === 5) return [5];
        return [cards[0].value];
      }
      case 5: return cards.map(c => c.value);
      case 6: return [byCount[0], byCount[1]];
      case 7: return [byCount[0], ...cards.filter(c => c.value !== byCount[0]).map(c => c.value)];
      case 9: case 10: return [];
      default: return cards.map(c => c.value);
    }
  };
  const ka = getKeys(a), kb = getKeys(b);
  for (let i = 0; i < Math.max(ka.length, kb.length); i++) {
    if ((ka[i] || 0) !== (kb[i] || 0)) return (ka[i] || 0) - (kb[i] || 0);
  }
  const SR = { '♠': 4, '♦': 3, '♥': 2, '♣': 1 };
  const sa = SR[a.cards.slice().sort((x,y) => y.value - x.value)[0].suit] || 0;
  const sb = SR[b.cards.slice().sort((x,y) => y.value - x.value)[0].suit] || 0;
  return sa - sb;
}

function setPvpStatus(type) {
  const el = document.getElementById('pvpStatusMsg');
  if (!el) return;
  el.className = '';
  switch (type) {
    case 'idle':
      el.textContent = 'ARCADE BATTLE';
      el.style.color = 'rgba(201,168,76,0.3)';
      break;
    case 'completed':
      el.textContent = '✓ COMPLETED';
      el.classList.add('pvp-status-blink', 'pvp-status-completed');
      el.style.color = '';
      break;
    case 'oppdone':
      el.textContent = '⚠ OPP DONE';
      el.classList.add('pvp-status-blink', 'pvp-status-oppdone');
      el.style.color = '';
      break;
    case 'timelimit':
      el.textContent = '⚡ TIME LIMIT';
      el.classList.add('pvp-status-blink', 'pvp-status-timelimit');
      el.style.color = '';
      break;
  }
}

function pvpHandSort(a, b) {
  if (b.rank !== a.rank) return b.rank - a.rank;
  return compareHandStrength(b, a);
}

// 게임 로직
// =============================================

function setupGameUI() {
  // 상태 초기화
  setPvpStatus('idle');

  // 칩 표시
  document.getElementById('oppChip').textContent = pvpArcade.opponent.chip.toLocaleString();
  const myChip = parseInt(localStorage.getItem('userChip') || '0');
  const myChipEl = document.getElementById('myChipDisplay');
  if (myChipEl) myChipEl.textContent = myChip.toLocaleString();

  // START 오버레이
  document.getElementById('pvpStartTitle').textContent = i18n.t('pvp.arcade.title');
  document.getElementById('pvpStartSubtitle').textContent =
    i18n.t('pvp.arcade.vs').replace('{name}', pvpArcade.opponent.username);
  const overlay = document.getElementById('startOverlay');
  overlay.style.display = '';
  overlay.classList.remove('hiding');
  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = '▶ START';
  startBtn.disabled = false;

  // 점수판
  renderScoreboard();

  // 그리드 초기화
  clearInterval(state.timerInterval);
  initState();
  initGrid();
  renderGrid();
  updateHandPanel();
  renderRemovedCards();

  // 타이머 리셋 (색상 + 값)
  const timerNumEl = document.getElementById('timerNum');
  const timerRingEl = document.getElementById('timerRing');
  if (timerNumEl) { timerNumEl.classList.remove('time-attack'); timerNumEl.style.color = ''; timerNumEl.textContent = '200'; }
  if (timerRingEl) { timerRingEl.classList.remove('time-attack'); timerRingEl.style.stroke = ''; }

  // 모달 닫기
  document.getElementById('modalOverlay').classList.remove('active');

  // 그리드 터치 비활성화 (START 전)
  const grid = document.getElementById('gridContainer');
  if (grid) grid.style.pointerEvents = 'none';

  // endGame 오버라이드
  window.endGame = function(reason) {
    if (!pvpArcade.gameStarted) return;
    if (state.phase === 'result' || state.phase === 'done') return;
    if (reason === 'complete' || reason === 'nomoves') {
      state.phase = 'done';
      setPvpStatus('completed');
      socket.emit('game:playerDone', { roomId: pvpArcade.roomId, reason });
    } else {
      state.phase = 'gameover';
      clearInterval(state.timerInterval);
      socket.emit('game:end', { roomId: pvpArcade.roomId });
    }
  };

  // finalizePath 래핑
  if (!window._origFinalizePath) window._origFinalizePath = window.finalizePath;
  window.finalizePath = function() {
    const prevCount = state.hands.length;
    window._origFinalizePath.call(this);
    const newCount = state.hands.length;
    if (newCount > prevCount) {
      const newHand = state.hands[state.hands.length - 1];
      const evalResult = evaluateHand(newHand.cards);
      const sortedCards = [...newHand.cards].sort((a, b) => b.value - a.value);
      const topSuit = sortedCards[0].suit;

      pvpArcade.myHands = state.hands.map(h => {
        const ev = evaluateHand(h.cards);
        const sc = [...h.cards].sort((a, b) => b.value - a.value);
        return { rank: ev.rank, label: ev.label, suit: sc[0].suit,
                 values: ev.values, suits: ev.suits, primaryVal: ev.primaryVal,
                 secondaryVal: ev.secondaryVal, kickers: ev.kickers, cards: h.cards };
      }).sort(pvpHandSort);

      renderScoreboard();
      socket.emit('game:handComplete', {
        roomId: pvpArcade.roomId,
        hand: {
          rank: evalResult.rank,
          label: evalResult.label,
          suit: topSuit,
          cards: newHand.cards.map(c => ({ value: c.value, suit: c.suit }))
        }
      });
    }
  };

  // 10초마다 핸드 싱크 체크
  clearInterval(pvpArcade.syncInterval);
  pvpArcade.syncInterval = setInterval(() => {
    if (!pvpArcade.gameStarted || (state.phase !== 'playing' && state.phase !== 'done')) return;
    socket.emit('game:syncRequest', { roomId: pvpArcade.roomId });
  }, 10000);

  // START 버튼 핸들러
  const newBtn = startBtn.cloneNode(true);
  startBtn.parentNode.replaceChild(newBtn, startBtn);
  newBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    Sound.warmup();
    socket.emit('game:start', { roomId: pvpArcade.roomId });
    newBtn.textContent = i18n.t('pvp.arcade.waiting');
    newBtn.disabled = true;
  });
}

// ─── 게임 소켓 이벤트 ───

socket.on('game:waiting', () => {
  const btn = document.getElementById('startBtn');
  if (btn) { btn.textContent = i18n.t('pvp.arcade.waiting'); btn.disabled = true; }
});

socket.on('game:started', ({ roomId, startedAt }) => {
  if (roomId !== pvpArcade.roomId) return;
  pvpArcade.gameStarted = true;

  const overlay = document.getElementById('startOverlay');
  if (overlay) {
    overlay.classList.add('hiding');
    setTimeout(() => {
      overlay.style.display = 'none';
      overlay.classList.remove('hiding');
      const grid = document.getElementById('gridContainer');
      if (grid) grid.style.pointerEvents = '';
    }, 300);
  }

  BGM.init('./audio/Main_Theme.mp3');
  BGM.start();

  state.phase = 'playing';
  const elapsed = Math.floor((Date.now() - startedAt) / 1000);
  const remaining = Math.max(1, TIMER_SECONDS - elapsed);
  startTimer();
  state.timer = remaining;
  updateTimerDisplay();
});

socket.on('opponent:handComplete', ({ hands, count }) => {
  console.log('[pvp] 상대 패 수신:', hands.length);
  pvpArcade.opponentHands = hands;
  renderScoreboard();
});

socket.on('game:syncResponse', ({ myHands, oppHands }) => {
  if (oppHands.length !== pvpArcade.opponentHands.length) {
    console.log('[pvp] 핸드 싱크 보정:', oppHands.length);
    pvpArcade.opponentHands = oppHands;
    renderScoreboard();
  }
});

socket.on('pvp:pendingNotification', (data) => {
  localStorage.setItem('userChip', String(data.newChip));
  window.dispatchEvent(new Event('chipUpdated'));
  const modal = document.getElementById('modal');
  const overlay = document.getElementById('modalOverlay');
  const dc = data.chipDelta < 0 ? '#ff5252' : '#4CAF50';
  modal.innerHTML = `
    <h2 style="font-size:1.2rem;">${i18n.t('pvp.arcade.oppLeft').replace('상대방이', '이전 게임에서')}</h2>
    <div style="color:rgba(255,255,255,0.5);font-size:0.85rem;margin:12px 0;">이전 게임에서 접속이 종료되었습니다.</div>
    <div style="font-size:1rem;font-weight:700;color:${dc};margin:8px 0;">${data.chipDelta} chip</div>
    <div style="font-size:0.78rem;color:rgba(255,255,255,0.4);margin-bottom:12px;"><img src="./images/chip.png" style="width:14px;height:14px;vertical-align:-2px;"> ${data.newChip.toLocaleString()}</div>
    <button class="pvp-popup-btn" onclick="document.getElementById('modalOverlay').classList.remove('active')">${i18n.t('ui.confirm')}</button>
  `;
  overlay.classList.add('active');
});

socket.on('game:playerDone', ({ socketId, username, reason, timerAdjusted, newRemaining }) => {
  if (timerAdjusted) {
    clearInterval(state.timerInterval);
    state.timer = 50;
    updateTimerDisplay();
    state.timerInterval = setInterval(() => {
      if (state.phase !== 'playing' && state.phase !== 'done') return;
      state.timer--;
      updateTimerDisplay();
      if (state.timer <= 0) socket.emit('game:end', { roomId: pvpArcade.roomId });
    }, 1000);
  }

  const timerNum = document.getElementById('timerNum');
  const timerRing = document.getElementById('timerRing');
  if (timerNum) timerNum.style.color = '#ff5252';
  if (timerRing) timerRing.style.stroke = '#ff5252';

  const isMine = socketId === socket.id;
  setPvpStatus(isMine ? 'completed' : 'oppdone');
  if (timerAdjusted) setTimeout(() => setPvpStatus('timelimit'), 500);
});

socket.on('game:result', (data) => {
  if (data.roomId !== pvpArcade.roomId) return;
  state.phase = 'result';
  clearInterval(state.timerInterval);
  setPvpStatus('idle');
  const myChip = data.newChip[socket.id];
  if (myChip !== undefined) {
    localStorage.setItem('userChip', String(myChip));
    window.dispatchEvent(new Event('chipUpdated'));
    const el = document.getElementById('myChipDisplay');
    if (el) el.textContent = myChip.toLocaleString();
  }
  showResult(data);
});

socket.on('room:opponentDisconnected', () => {
  if (document.getElementById('view-game').style.display === 'none') return;
  state.phase = 'result';
  clearInterval(state.timerInterval);
  showDisconnectResult();
});

socket.on('rematch:requested', () => { /* 서버가 양쪽 요청 시 자동 처리 */ });
socket.on('rematch:declined', () => {
  showToast(i18n.t('pvp.arcade.rematchDeclined'));
  clearTimeout(pvpArcade.rematchTimer);
  const w = document.getElementById('rematchWait'); if (w) w.textContent = '';
  const b = document.getElementById('btnRematch'); if (b) b.style.display = 'none';
});

// ─── 소켓 disconnect/reconnect ───
socket.on('disconnect', (reason) => {
  console.log('[pvp] 소켓 disconnect:', reason);
  if (pvpArcade.gameStarted && state.phase !== 'result' && state.phase !== 'idle') {
    state.phase = 'result';
    clearInterval(state.timerInterval);
    clearInterval(pvpArcade.syncInterval);
    showDisconnectWarning();
  }
});

socket.io.on('reconnect', () => {
  console.log('[pvp] 소켓 재연결 성공');
  clearTimeout(pvpArcade.disconnectTimeout);

  const overlay = document.getElementById('modalOverlay');
  if (overlay) overlay.classList.remove('active');

  if (pvpArcade.gameStarted) {
    pvpArcade.gameStarted = false;
    pvpArcade.roomId = null;
    pvpArcade.opponent = null;
    pvpArcade.myHands = [];
    pvpArcade.opponentHands = [];
    state.phase = 'idle';
    clearInterval(state.timerInterval);
    showView('lobby');
    joinLobby();
    renderMatchButtons('idle');
    showToast('서버와 재연결되었습니다.');
  }
  // pvpArcade.gameStarted가 false면 (로비 상태)
  // 'connect' 이벤트가 이미 joinLobby를 처리하므로
  // 여기서 추가 호출 안 함
});

socket.io.on('reconnect_failed', () => {
  console.log('[pvp] 소켓 재연결 실패');
  clearTimeout(pvpArcade.disconnectTimeout);
  goToLobby();
});

function showDisconnectWarning() {
  const modal = document.getElementById('modal');
  const overlay = document.getElementById('modalOverlay');
  if (!modal || !overlay) return;
  modal.innerHTML = `
    <div style="text-align:center;padding:16px 0;">
      <div style="font-size:1.1rem;color:var(--gold);margin-bottom:12px;">서버 연결이 끊겼습니다.</div>
      <div style="color:rgba(255,255,255,0.5);font-size:0.85rem;margin-bottom:16px;">재연결 시도 중...</div>
      <div style="font-size:1.5rem;">⏳</div>
    </div>`;
  overlay.classList.add('active');
  pvpArcade.disconnectTimeout = setTimeout(() => {
    showToast('연결이 끊어졌습니다. 로비로 이동합니다.');
    goToLobby();
  }, 10000);
}

// ─── 점수판 ───
function renderScoreboard() {
  const container = document.getElementById('scoreboard');
  if (!container) return;
  const myName = localStorage.getItem('poker_username') || 'ME';
  const oppName = pvpArcade.opponent ? pvpArcade.opponent.username : 'OPP';
  const myCount = pvpArcade.myHands.length;
  const oppCount = pvpArcade.opponentHands.length;
  let html = `<div class="pvp-sb-header"><span class="pvp-sb-cell left">${myName} (${myCount}/9)</span><span class="pvp-sb-cell vs"></span><span class="pvp-sb-cell right">${oppName} (${oppCount}/9)</span></div>`;
  const mySorted = [...pvpArcade.myHands].sort(pvpHandSort);
  const oppSorted = [...pvpArcade.opponentHands].sort(pvpHandSort);
  for (let i = 0; i < 9; i++) {
    const my = mySorted[i], opp = oppSorted[i];
    let myText = '—', oppText = '—', myClass = '', oppClass = '', vsIcon = '';
    if (my) myText = my.label;
    if (opp) oppText = opp.label;
    if (my && opp) {
      if (my.rank > opp.rank) { myClass = 'win'; vsIcon = '👑'; }
      else if (opp.rank > my.rank) { oppClass = 'win'; vsIcon = '👑'; }
      else { vsIcon = '?'; }
    } else if (my && !opp) { myClass = 'win'; }
    else if (!my && opp) { oppClass = 'win'; }
    const lc = myClass === 'win' ? '👑 ' : '', rc = oppClass === 'win' ? ' 👑' : '';
    html += `<div class="pvp-sb-row"><span class="pvp-sb-cell left"><span class="${myClass}">${lc}${myText}</span></span><span class="pvp-sb-cell vs">${vsIcon}</span><span class="pvp-sb-cell right"><span class="${oppClass}">${oppText}${rc}</span></span></div>`;
  }
  container.innerHTML = html;
}

// ─── 결과 / 재대결 ───
function showResult(data) {
  const modal = document.getElementById('modal');
  const overlay = document.getElementById('modalOverlay');
  const myId = socket.id;
  const myDelta = data.chipDelta[myId] || 0;
  const myNewChip = data.newChip[myId] || 0;

  // 서버에서 보낸 hands 사용 (cards 포함)
  const myHands = (data.myHands || []).slice().sort(pvpHandSort);
  const oppHands = (data.oppHands || []).slice().sort(pvpHandSort);

  let tableHTML = '<div style="margin:12px 0;">';
  for (let i = 0; i < 9; i++) {
    const r = data.results[i] || 'draw';
    const my = myHands[i];
    const opp = oppHands[i];
    const myLabel = my ? my.label : '—';
    const oppLabel = opp ? opp.label : '—';
    const myWin = r === 'A', oppWin = r === 'B';
    tableHTML += `<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
      <div style="display:flex;font-size:0.75rem;margin-bottom:2px;">
        <span style="flex:1;color:${myWin ? 'var(--gold)' : 'rgba(255,255,255,0.4)'};">${myWin ? '👑 ' : ''}${myLabel}</span>
        <span style="flex:1;text-align:right;color:${oppWin ? 'var(--gold)' : 'rgba(255,255,255,0.4)'};">${oppLabel}${oppWin ? ' 👑' : ''}</span>
      </div>
      <div style="display:flex;font-size:0.6rem;">
        <span style="flex:1;opacity:0.7;">${pvpCardDisplay(my?.cards)}</span>
        <span style="flex:1;text-align:right;opacity:0.7;">${pvpCardDisplay(opp?.cards)}</span>
      </div>
    </div>`;
  }
  tableHTML += '</div>';

  let chipHTML = '';
  if (data.isDraw) {
    chipHTML = `<div style="color:rgba(255,255,255,0.5);font-size:0.85rem;margin:8px 0;">${i18n.t('pvp.arcade.draw')}</div>`;
  } else {
    const sign = myDelta >= 0 ? '+' : '';
    const dc = myDelta >= 0 ? '#4CAF50' : '#ff5252';
    const prevChip = myNewChip - myDelta;
    const feeNote = data.tableFee > 0 && myDelta > 0
      ? ` <span style="font-size:0.68rem;color:rgba(255,255,255,0.3);">(테이블비 ${data.tableFee} 반영)</span>` : '';
    chipHTML = `<div style="font-size:1.1rem;font-weight:700;color:${dc};margin:8px 0;">${sign}${myDelta} chip${feeNote}</div>
      <div style="font-size:0.78rem;color:rgba(255,255,255,0.4);"><img src="./images/chip.png" style="width:14px;height:14px;vertical-align:-2px;"> ${prevChip.toLocaleString()} → ${myNewChip.toLocaleString()}</div>`;
  }

  let buttonsHTML = '';
  if (data.reason === 'disconnect') {
    buttonsHTML = `<div style="color:rgba(255,255,255,0.5);font-size:0.8rem;margin:8px 0;">${i18n.t('pvp.arcade.oppLeft')}</div><button class="pvp-popup-btn" onclick="goToLobby()">${i18n.t('pvp.arcade.toLobby')}</button>`;
  } else if (data.canRematch) {
    buttonsHTML = `<div style="display:flex;gap:8px;margin-top:12px;"><button class="pvp-popup-btn" id="btnRematch" onclick="requestRematch()" style="flex:1;">${i18n.t('pvp.arcade.rematch')}</button><button class="pvp-popup-btn reject" onclick="goToLobby()" style="flex:1;">${i18n.t('pvp.arcade.toLobby')}</button></div><div id="rematchWait" style="color:rgba(255,255,255,0.4);font-size:0.75rem;margin-top:6px;"></div>`;
  } else {
    const noRematchMsg = data.noRematchReason === 'opp_chip'
      ? i18n.t('pvp.arcade.noChipOpp') : i18n.t('pvp.arcade.noChipMine');
    buttonsHTML = `<div style="color:rgba(255,255,255,0.5);font-size:0.8rem;margin:8px 0;">${noRematchMsg}</div><button class="pvp-popup-btn" onclick="goToLobby()">${i18n.t('pvp.arcade.toLobby')}</button>`;
  }

  modal.innerHTML = `<h2 style="font-size:1.3rem;">${i18n.t('pvp.arcade.result')}</h2>${tableHTML}<div style="display:flex;justify-content:center;gap:24px;font-size:0.85rem;margin:8px 0;"><span style="color:var(--gold);">${i18n.t('pvp.arcade.myWins').replace('{n}', data.myWins)}</span><span style="color:rgba(255,255,255,0.5);">${i18n.t('pvp.arcade.oppWins').replace('{n}', data.oppWins)}</span></div>${chipHTML}${buttonsHTML}`;
  overlay.classList.add('active');
}

function showDisconnectResult() {
  const modal = document.getElementById('modal');
  const overlay = document.getElementById('modalOverlay');
  modal.innerHTML = `<h2 style="font-size:1.3rem;">${i18n.t('pvp.arcade.result')}</h2><div style="color:rgba(255,255,255,0.5);font-size:0.85rem;margin:16px 0;">${i18n.t('pvp.arcade.oppLeft')}</div><button class="pvp-popup-btn" onclick="goToLobby()">${i18n.t('pvp.arcade.toLobby')}</button>`;
  overlay.classList.add('active');
}

function pvpCardDisplay(cards) {
  if (!cards || !cards.length) return '';
  const VN = {14:'A',13:'K',12:'Q',11:'J',10:'10',9:'9',8:'8',7:'7',6:'6',5:'5',4:'4',3:'3',2:'2'};
  return cards.slice().sort((a,b) => b.value - a.value).map(c => {
    const red = c.suit === '♥' || c.suit === '♦';
    return `<span style="color:${red ? '#ff6b6b' : '#e0e0e0'}">${VN[c.value]}${c.suit}</span>`;
  }).join(' ');
}

function requestRematch() {
  if (pvpArcade.rematchRequested) return;
  pvpArcade.rematchRequested = true;
  socket.emit('rematch:request', { roomId: pvpArcade.roomId });
  const w = document.getElementById('rematchWait'); if (w) w.textContent = i18n.t('pvp.arcade.waiting');
  const b = document.getElementById('btnRematch'); if (b) b.disabled = true;
  pvpArcade.rematchTimer = setTimeout(() => {
    showToast(i18n.t('pvp.arcade.rematchDeclined'));
    if (w) w.textContent = '';
    if (b) b.style.display = 'none';
  }, 30000);
}

function goToLobby() {
  if (pvpArcade.roomId) {
    socket.emit('rematch:cancel', { roomId: pvpArcade.roomId });
  }
  clearTimeout(pvpArcade.rematchTimer);
  clearTimeout(pvpArcade.disconnectTimeout);
  clearInterval(pvpArcade.syncInterval);
  pvpArcade.roomId = null;
  pvpArcade.opponent = null;
  pvpArcade.myHands = [];
  pvpArcade.opponentHands = [];
  pvpArcade.gameStarted = false;
  pvpArcade.rematchRequested = false;
  clearInterval(state.timerInterval);
  state.phase = 'idle';
  document.getElementById('modalOverlay').classList.remove('active');
  lobbyUsers = [];
  matchingMode = null;
  challengeTarget = null;
  showView('lobby');
  joinLobby();
  renderMatchButtons('idle');
}

// ─── 페이지 이탈 ───
window.addEventListener('beforeunload', (e) => {
  if (pvpArcade.gameStarted &&
      state.phase !== 'result' &&
      state.phase !== 'idle') {
    e.preventDefault();
    e.returnValue = '';  // 브라우저 기본 경고창 표시
  }
  socket.emit('lobby:leave');
  clearInterval(heartbeatInterval);
});
</script>
</body>
</html>
