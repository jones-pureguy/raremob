<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>DragON POKER - Leaderboard</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="landscape-block"><div class="rotate-icon">📱</div><div class="rotate-text">세로 모드로 회전해주세요</div></div>

<div class="back-fixed"><a href="mode_select.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>

<div id="leaderboardPage">
  <header class="lb-header">
    <h1 class="lb-title" data-i18n="leaderboard.title">LEADERBOARD</h1>
  </header>

  <!-- period 탭 (1depth) -->
  <nav class="tabs-period" role="tablist">
    <button class="tab-period active" data-period="all_time" data-i18n="leaderboard.period.all_time">누적</button>
    <button class="tab-period"        data-period="daily"    data-i18n="leaderboard.period.daily">일간</button>
    <button class="tab-period"        data-period="weekly"   data-i18n="leaderboard.period.weekly">주간</button>
    <button class="tab-period"        data-period="monthly"  data-i18n="leaderboard.period.monthly">월간</button>
  </nav>

  <!-- board 탭 (2depth) -->
  <nav class="tabs-board" role="tablist">
    <button class="tab-board active" data-board="basic"        data-i18n="leaderboard.board.basic">일반</button>
    <button class="tab-board"        data-board="infinite"     data-i18n="leaderboard.board.infinite">인피니트</button>
    <button class="tab-board"        data-board="hidden"       data-i18n="leaderboard.board.hidden">히든</button>
    <button class="tab-board"        data-board="basic_retry"  data-i18n="leaderboard.board.retry">RETRY</button>
  </nav>

  <!-- 다음 리셋 안내 -->
  <div id="nextResetHint" class="next-reset-hint" hidden></div>

  <!-- sort 토글 -->
  <div class="sort-toggles">
    <span class="sort-label" data-i18n="leaderboard.sort.label">정렬:</span>
    <button class="sort-btn active" data-sort="best" data-i18n="leaderboard.sort.best">베스트</button>
    <button class="sort-btn"        data-sort="sum"  data-i18n="leaderboard.sort.sum">누적</button>
    <button class="sort-btn"        data-sort="avg"  data-i18n="leaderboard.sort.avg">평균</button>
  </div>

  <!-- 상단 리스트 영역 -->
  <div id="listArea" class="list-area"></div>

  <!-- 한줄 바 (현재 선택 맥락) -->
  <div id="myRankBar" class="my-rank-bar" hidden></div>

  <!-- 하단 스탯 영역 -->
  <div id="myStatsArea" class="my-stats-area"></div>
</div>

<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="server_client.js"></script>
<script src="leaderboard_script.js"></script>
</body>
</html>
