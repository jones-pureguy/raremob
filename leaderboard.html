<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DragON POKER - Leaderboard</title>
<link rel="stylesheet" href="style.css">
<style>
  .lb-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.3);
  }
  .lb-tab {
    flex: 1;
    padding: 10px 16px;
    white-space: nowrap;
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.5);
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lb-tab:not(:last-child) { border-right: 1px solid rgba(201,168,76,0.3); }
  .lb-tab:hover { background: rgba(201,168,76,0.1); }
  .lb-tab.active {
    background: rgba(201,168,76,0.2);
    color: var(--gold);
  }
</style>
</head>
<body>

<div class="menu-container">
  <div class="menu-title">LEADERBOARD</div>
  <div class="lb-tabs">
    <button class="lb-tab active" id="tabNormal" onclick="switchTab('normal')">일반 순위</button>
    <button class="lb-tab" id="tabRetry" onclick="switchTab('retry')">RETRY 순위</button>
  </div>
  <div class="leaderboard-wrap" id="leaderboardWrap">
    <div class="loading">불러오는 중...</div>
  </div>
  <div style="margin-top:20px;">
    <a href="index.html" class="menu-btn small">메인메뉴</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const currentUser = localStorage.getItem('poker_username') || '';
  let currentTab = 'normal';

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabNormal').classList.toggle('active', tab === 'normal');
    document.getElementById('tabRetry').classList.toggle('active', tab === 'retry');
    loadLeaderboard();
  }

  async function loadLeaderboard() {
    const wrap = document.getElementById('leaderboardWrap');
    const table = currentTab === 'retry' ? 'leaderboard_r' : 'leaderboard';
    wrap.innerHTML = '<div class="loading">불러오는 중...</div>';
    try {
      const { data: rows, error } = await sb
        .from(table)
        .select('username, score, best_hand, replay_id')
        .order('score', { ascending: false })
        .limit(20);

      if (error) { wrap.innerHTML = '<div class="loading" style="color:#ff5252;">오류: ' + error.message + '</div>'; return; }
      if (!rows || rows.length === 0) { wrap.innerHTML = '<div class="loading">아직 기록이 없습니다</div>'; return; }

      let html = '<table class="leaderboard-table"><thead><tr><th>#</th><th>NAME</th><th>SCORE</th><th>BEST HAND</th><th></th></tr></thead><tbody>';
      rows.forEach((row, i) => {
        const hl = currentUser && row.username.toLowerCase() === currentUser.toLowerCase() ? ' class="highlight"' : '';
        const replayBtn = row.replay_id
          ? '<a href="replay.html?id=' + row.replay_id + '" class="lb-replay-btn" title="Replay">▶</a>'
          : '';
        html += '<tr' + hl + '><td>' + (i + 1) + '</td><td>' + escapeHTML(row.username) + '</td><td>' + row.score + '</td><td>' + escapeHTML(row.best_hand || '-') + '</td><td>' + replayBtn + '</td></tr>';
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
    } catch (err) {
      wrap.innerHTML = '<div class="loading" style="color:#ff5252;">오류 발생</div>';
    }
  }

  loadLeaderboard();
</script>
</body>
</html>
