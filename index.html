<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>DragON POKER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu-container">
  <img src="images/logo.webp" alt="DragON POKER" class="menu-logo">

  <div class="menu-player" id="menuPlayer"></div>
  <div class="menu-buttons">
    <a href="game.html" class="menu-btn">게임하기</a>
    <a href="leaderboard.html" class="menu-btn">하이스코어</a>
    <a href="#" class="menu-btn disabled">대전하기</a>
    <a href="replay.html?source=local" class="menu-btn">리플레이</a>
    <a href="id.html" class="menu-btn">아이디등록</a>
  </div>
</div>

<script>
  // 아이디 없으면 id.html로 이동
  const savedUsername = localStorage.getItem('poker_username');
  if (!savedUsername) {
    window.location.href = 'id.html';
  } else {
    document.getElementById('menuPlayer').textContent = savedUsername;
  }
</script>
</body>
</html>
