<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>DragON POKER</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .splash-logo {
    width: 240px;
    max-width: 60vw;
    object-fit: contain;
  }
  .splash-touch {
    position: fixed;
    bottom: 80px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #7B2FF2;
    opacity: 0;
    transition: opacity 0.4s;
    cursor: pointer;
  }
  .splash-touch.visible {
    opacity: 1;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<img src="./images/raremob.webp" alt="DragON POKER" class="splash-logo">
<div class="splash-touch" id="touchStart">TOUCH TO START</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="sound.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="server_client.js"></script>
<script src="gold_client.js"></script>
<script>
  let syncDone = false;

  // ─── Gold sync on start ───
  async function syncGoldOnStart() {
    const playerId = localStorage.getItem('poker_player_id');
    if (!playerId) return;

    const { data } = await sb
      .from('players')
      .select('gold')
      .eq('id', playerId)
      .single();

    if (data) {
      const dbGold = data.gold || 0;
      const localRaw = localStorage.getItem('poker_gold');
      const localGold = parseInt(localRaw || '0');

      let resolvedGold;
      if (localRaw === null) {
        resolvedGold = dbGold;
      } else {
        resolvedGold = localGold;
      }

      localStorage.setItem('poker_gold', resolvedGold);
      if (resolvedGold !== dbGold) {
        sb.from('players').update({ gold: resolvedGold }).eq('id', playerId)
          .then(({ error }) => { if (error) console.error('Gold sync error:', error); });
      }

      localStorage.removeItem('poker_gold_pending_deduct');
    }
  }

  // ─── Chip sync on start ───
  // [PHASE_2D_PRE] getApi/callApi 사용 — JWT 자동 첨부, playerId 서버에서 req.userId로 대체
  async function syncChipOnStart() {
    const playerId = localStorage.getItem('poker_player_id');
    if (!playerId) return;
    const username = localStorage.getItem('poker_username') || '';

    try {
      const qs = username ? `?username=${encodeURIComponent(username)}` : '';
      const data = await getApi(`/chip/balance${qs}`);
      if (data && typeof data.chip === 'number') {
        localStorage.setItem('userChip', String(data.chip));
        window.dispatchEvent(new Event('chipUpdated'));
      }
    } catch (e) {
      console.error('Chip balance fetch failed:', e);
    }

    const today = new Date().toISOString().slice(0, 10);
    const lastReset = localStorage.getItem('chipLastReset');

    if (lastReset === today) return;

    const currentChip = parseInt(localStorage.getItem('userChip') || '0');

    if (currentChip < 100) {
      try {
        const data = await callApi('/chip/daily-reset', { username: username || null });
        if (data && data.success) {
          localStorage.setItem('userChip', '100');
          localStorage.setItem('chipLastReset', today);
          window.dispatchEvent(new Event('chipUpdated'));
          localStorage.setItem('poker_chip_restored', '1');
        }
      } catch (e) {
        console.error('Chip daily reset failed:', e);
      }
    } else {
      localStorage.setItem('chipLastReset', today);
    }
  }

  // ─── 백그라운드 싱크 ───
  (async function initSplash() {
    await i18n.init();
    const uid = await initAuth();

    if (uid) {
      const { data } = await sbRetry(() =>
        sb.from('players').select('username, gold').eq('id', uid).single()
      );
      if (data && data.username) {
        localStorage.setItem('poker_username', data.username);
        localStorage.setItem('poker_player_id', uid);
      }

      await syncGoldOnStart();
      await syncChipOnStart();
    }

    syncDone = true;
    document.getElementById('touchStart').classList.add('visible');
  })();

  // ─── 터치 핸들러 ───
  function handleTouch() {
    if (!syncDone) return;

    Sound.warmup();

    const tutDone = localStorage.getItem('poker_tutorial_done');
    const savedUsername = localStorage.getItem('poker_username');

    if (!tutDone) {
      window.location.href = 'tutorial.html';
    } else if (!savedUsername) {
      window.location.href = 'id.html';
    } else {
      window.location.href = 'mode_select.html';
    }
  }

  document.getElementById('touchStart').addEventListener('click', handleTouch);
  document.body.addEventListener('click', function(e) {
    if (syncDone && e.target !== document.getElementById('touchStart')) {
      handleTouch();
    }
  });
</script>
</body>
</html>
