<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>DragON POKER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu-container">
  <div class="currency-bar" style="justify-content:center;margin-bottom:8px;">
    <div class="currency-item">
      <img src="./images/coin.png" alt="gold" class="currency-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'"><span style="display:none; font-size:1rem;">💰</span>
      <span class="currency-value" id="goldDisplay">0</span>
    </div>
    <div class="currency-item">
      <img src="./images/chip.png" alt="chip" class="currency-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'"><span style="display:none; font-size:1rem;">🎰</span>
      <span class="currency-value" id="chipDisplay">0</span>
    </div>
  </div>
  <img src="images/logo.webp" alt="DragON POKER" class="menu-logo">

  <div class="menu-player" id="menuPlayer"></div>
  <div class="menu-buttons">
    <a href="game.html" class="menu-btn">베이직모드</a>
    <a href="stage_select.html" class="menu-btn">도전모드</a>
    <a href="puzzle_select.html" class="menu-btn">퍼즐모드</a>
    <a href="leaderboard.html" class="menu-btn">랭킹</a>
    <a href="replay.html?source=local" class="menu-btn">리플레이</a>
    <a href="id.html" class="menu-btn">아이디관리</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://guuqhfxuxwpicneitwvw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2NckQv-JOwvcgrebVMmNsQ_x5Z9AxWA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="auth.js"></script>
<script>
  // 로컬 즉시 표시
  const savedUsername = localStorage.getItem('poker_username');
  if (!savedUsername) {
    window.location.href = 'id.html';
  } else {
    document.getElementById('menuPlayer').textContent = savedUsername;
  }

  // Currency bar
  (function renderCurrencyBar() {
    const gold = parseInt(localStorage.getItem('poker_gold') || '0');
    const goldEl = document.getElementById('goldDisplay');
    const chipEl = document.getElementById('chipDisplay');
    if (goldEl) goldEl.textContent = gold.toLocaleString();
    if (chipEl) chipEl.textContent = '0';
  })();

  // 백그라운드 auth + DB 싱크
  (async function checkUserReady() {
    const uid = await initAuth();
    if (!uid) return;

    const { data } = await sb
      .from('players')
      .select('username, gold')
      .eq('id', uid)
      .single();

    if (!data || !data.username) {
      window.location.href = 'id.html';
      return;
    }

    localStorage.setItem('poker_username', data.username);
    localStorage.setItem('poker_player_id', uid);
    localStorage.setItem('poker_gold', data.gold || 0);

    document.getElementById('menuPlayer').textContent = data.username;
    const goldEl = document.getElementById('goldDisplay');
    if (goldEl) goldEl.textContent = parseInt(data.gold || 0).toLocaleString();
  })();
</script>
</body>
</html>
