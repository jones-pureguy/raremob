<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>POKE-R ♠</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="title">POKE-R ♠</div>
  <div style="display:flex;align-items:center;gap:8px;">
  <input class="username-input" id="usernameInput" type="text" placeholder="NAME" maxlength="12" spellcheck="false">
  <button class="restart-btn" id="restartBtn" title="재시작">↺</button>
  <select class="mode-selector" id="modeSelector">
    <option value="1">Mode 1 · 자유+점프</option>
    <option value="2">Mode 2 · 자유</option>
    <option value="3">Mode 3 · 직선</option>
    <option value="4">Mode 4 · 가로세로</option>
  </select>
  </div>
</div>

<div class="status-bar">
  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 40 40">
      <circle class="timer-ring-bg" cx="20" cy="20" r="16" />
      <circle class="timer-ring-fg" id="timerRing" cx="20" cy="20" r="16"
        stroke-dasharray="100.53" stroke-dashoffset="0"
        transform="rotate(-90 20 20)" />
    </svg>
    <div class="timer-num" id="timerNum">100</div>
  </div>
  <div class="score-display">
    <div class="current-score" id="currentScore">0</div>
    <div class="high-score">HI <span id="highScoreDisplay">0</span></div>
  </div>
  <div class="hand-counter"><span id="handCount">0</span>/9 🃏</div>
</div>

<div class="grid-container" id="gridContainer">
  <div class="grid" id="grid"></div>
  <svg class="drag-svg" id="dragSvg"><polyline class="drag-line" id="dragLine" points="" /></svg>
</div>

<div class="hand-preview" id="handPreview"></div>

<div class="hand-panel">
  <div class="hand-panel-title">BEST HANDS</div>
  <div class="hand-slots" id="handSlots"></div>
</div>

<div class="removed-panel">
  <div class="removed-panel-title">REMOVED</div>
  <div class="removed-cards" id="removedCards"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div class="modal-overlay" id="leaderboardOverlay">
  <div class="modal leaderboard-modal" id="leaderboardModal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://xxxxxxxxxxx.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.xxxxx';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<script src="script.js"></script>
</body>
</html>
